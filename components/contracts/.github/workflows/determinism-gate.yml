name: Determinism Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: A-TownChain-Okosystems/atclang
          path: atclang
      - uses: dtolnay/rust-toolchain@stable
      - name: Build canonical ATCLang CLI
        run: cargo build --locked --release --manifest-path atclang/crates/atc-core/Cargo.toml
      - name: Build canonical ATVM runner
        working-directory: components/vm
        run: cargo build --locked --bin atc-vm-runner
      - name: Deterministic ATCLang + ATVM run 1
        env:
          ATCLANG_ROOT: ${{ github.workspace }}/atclang
          ATC_VM_RUNNER: ${{ github.workspace }}/components/vm/target/debug/atc-vm-runner
        run: |
          ATCLANG_ROOT="${{ github.workspace }}/atclang" ATC_CLI="${{ github.workspace }}/atclang/target/release/atc" bash components/contracts/tests/run_atclang_conformance.sh | tee /tmp/conformance-1.log
          bash components/contracts/exec_chain/tests/run_tests.sh | tee /tmp/exec-1.log
      - name: Deterministic ATCLang + ATVM run 2
        env:
          ATCLANG_ROOT: ${{ github.workspace }}/atclang
          ATC_VM_RUNNER: ${{ github.workspace }}/components/vm/target/debug/atc-vm-runner
        run: |
          ATCLANG_ROOT="${{ github.workspace }}/atclang" ATC_CLI="${{ github.workspace }}/atclang/target/release/atc" bash components/contracts/tests/run_atclang_conformance.sh | tee /tmp/conformance-2.log
          bash components/contracts/exec_chain/tests/run_tests.sh | tee /tmp/exec-2.log
      - name: Compare deterministic evidence
        run: |
          diff -u /tmp/conformance-1.log /tmp/conformance-2.log
          diff -u /tmp/exec-1.log /tmp/exec-2.log
