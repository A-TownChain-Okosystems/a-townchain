[package]
name = "atc-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ATC Node Runtime — Konfiguration + Peer-Tabelle (MVP)"

[dependencies]
atc-algorithm = { path = "../algorithm" } # canonical SSOT: components/algorithm
atc_wallet = { path = "../wallet" } # kanonische Tx/Signatur (WAL-SIGN-001)
secp256k1 = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
