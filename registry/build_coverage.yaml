# Build-Abdeckung aller Cargo-Manifeste (Governance-Regel G-01)
#
# Regel (Owner-Entscheidung 12.11.2026, P1d-A): Kein sicherheitsrelevanter
# Rust-Code darf unbemerkt ausserhalb der Build- und Pruefabdeckung liegen.
# Deshalb ist jedes Cargo.toml hier klassifiziert. Ein neues Manifest ohne
# Eintrag laesst `tools/check_build_coverage.py` fehlschlagen.
#
# status:
#   workspace_member     wird im Haupt-Workspace gebaut und getestet
#   nested_workspace     eigener [workspace] in einem Unterbaum (eigener Build)
#   duplicate_retired    Dublette, stillgelegt, kein Build mehr
#   unverified_build     KEIN Build-/Testnachweis -> offener Befund
#
# `python3 tools/check_build_coverage.py --write` ergaenzt neue Manifeste,
# ohne vorhandene Gruende zu ueberschreiben.
