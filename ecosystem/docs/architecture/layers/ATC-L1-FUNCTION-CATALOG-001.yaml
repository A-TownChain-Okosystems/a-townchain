# ATC-L1-FUNCTION-CATALOG-001 — L1 Boot, Firmware & Hardware Abstraction Function Contracts
# SSOT: a-townchain-ecosystem (control/mapping/evidence layer)
# Layer: L1 (ATC-LAYER-L1-BOOT-FIRMWARE-HAL)
# Source: GitHub Issue #136 (owner Sollarchitektur, 2026-10-15)
# Version: 0.1.0
#
# Proposed stable catalog IDs defining function contracts, NOT existing
# implementations. All functions start UNRESOLVED until a canonical
# implementation is mapped and verified. VERIFIED requires exact commit
# and successful verification evidence; green CI alone is insufficient.

schema_id: ATC-L1-FUNCTION-CATALOG-001
schema_version: 0.2.0
generated: '2026-10-15'
status: DRAFT
layer_id: L1
architecture_id: ATC-LAYER-L1-BOOT-FIRMWARE-HAL
issue_reference: https://github.com/A-TownChain-Okosystems/a-townchain-ecosystem/issues/136
registry_reference: docs/architecture/layers/ATC-LAYER-REGISTRY-001.yaml
system_boundaries:
- 'L0: physical CPU, memory, devices, hardware security functions.'
- 'L1: initialization, integrity checks, platform description, kernel handoff.'
- 'L2: ShivaCore kernel with own memory management, interrupts, scheduling, IPC, capability enforcement.'
- 'L3+: GlobusOS and ecosystem services (desktop, blockchain, VM, developer platform, Aurora AI).'
- L1 does not replace the kernel and implements no second driver/kernel SSOT.
- Signature verification, measured boot, policy enforcement are separate functions; measurements alone prove no
  trust.
- Firmware tables and addresses are untrusted inputs requiring validation.
- Host adapters (Windows/Linux) are catalogued separately; a host tool is no native boot layer.
ssot_assignment:
  kernel_handoff_hal_platform_init: globus-os (ShivaCore kernel modules)
  uefi_bootloader_efi_entry: canonical GlobusOS boot implementation (globus-os)
  acpi_ecam_support: canonical GlobusOS platform implementation (globus-os)
  normative_boot_platform_contracts: atc-standards (if registered)
  layer_registry_mapping_evidence: a-townchain-ecosystem
layer_dependencies:
- target_layer: L2
  required_l1_capabilities: Validated memory map, CPU/platform state, kernel entry contract, interrupt and timer
    setup
- target_layer: L3
  required_l1_capabilities: Platform description, device inventory, boot parameters for service start
- target_layer: L4
  required_l1_capabilities: Graphics and input device availability from platform discovery
- target_layer: L5
  required_l1_capabilities: Secure boot chain evidence, memory limits, RNG/timestamp sources
- target_layer: L6
  required_l1_capabilities: Deterministic platform state and resource inventory
- target_layer: L7
  required_l1_capabilities: Build target characteristics and boot-supported platforms
- target_layer: L8
  required_l1_capabilities: Accelerator availability from platform discovery
- target_layer: L10
  required_l1_capabilities: Installability, supported firmware and boot modes per platform
