acceptance_criteria:
- All nine sub-layers have stable IDs and documented responsibilities.
- All 56 function contracts are catalogued with layer/sub-layer assignment.
- Every contract carries status, canonical repository, exact path/symbol, commit/blob SHA and evidence — or a reasoned
  EXCLUDED/UNRESOLVED entry.
- Boot sequence and kernel handoff are specified as verifiable contracts.
- UEFI, ACPI and ECAM functions are linked to actual source paths.
- Signature verification, measured boot and recovery are specified separately.
- Memory limits, MMIO, interrupts, DMA and IOMMU are covered on the security side.
- Intel, AMD and QEMU support targets are covered by concrete tests.
- Negative tests cover invalid tables, corrupted images, invalid memory ranges, failed verifications.
- VERIFIED only with exact commit and matching successful verification evidence; green CI alone is insufficient.
