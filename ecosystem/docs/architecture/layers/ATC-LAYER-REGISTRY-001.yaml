# ---------------------------------------------------------------------------
# CROSS-CUTTING LAYERS (X1-X8)
# These layers span multiple architecture layers. Components MAY reference
# additional cross-cutting layers via the `cross_cutting_layers` field.
# ---------------------------------------------------------------------------
cross_cutting_layers:
  - id: X1
    name: "Security & Trust"
    responsibility: >
      Identities, cryptography, key management, secure boot, TEE/TPM,
      sandboxing, threat models, security policies, and security audits.
    sub_layers:
      - X1.1: "Cryptography & Key Management (ECDSA, secp256k1, RFC 6979)"
      - X1.2: "Zero-Knowledge Proofs (ATC-ZKP)"
      - X1.3: "Secure Boot & Attestation"
      - X1.4: "Threat Models & Security Audits"
    components:
      - COMP-ZKP

  - id: X2
    name: "Identity, Access & Capability"
    responsibility: >
      Users, services, agents, roles, capability tokens, authorization,
      delegation, and least-privilege principle.
    sub_layers:
      - X2.1: "Identity Management (users, services, agents)"
      - X2.2: "Capability Tokens & Delegation"
      - X2.3: "Authorization & Access Control"
    components: []

  - id: X3
    name: "Protocol & Interoperability"
    responsibility: >
      Inter-process communication, APIs, network protocols, IPC, RPC,
      data formats, cross-chain messaging, and bridge security contracts.
    sub_layers:
      - X3.1: "IPC & RPC Protocols"
      - X3.2: "Cross-Chain Messaging & Bridges"
      - X3.3: "Data Formats & Serialization"
    components: []

  - id: X4
    name: "Data, State & Storage"
    responsibility: >
      Persistence, ledger state, configurations, data migration, backups,
      encryption, schema versioning, and data integrity.
    sub_layers:
      - X4.1: "Persistent Storage & Ledger State"
      - X4.2: "Configuration & Secrets"
      - X4.3: "Data Migration & Integrity"
    components:
      - COMP-STORAGE

  - id: X5
    name: "Standards, Governance & Policy"
    responsibility: >
      Normative specifications, protocol versions, change processes,
      compatibility, approvals, and responsibilities.
    sub_layers:
      - X5.1: "Normative Standards (atc-standards registry)"
      - X5.2: "Governance Processes (SCR, AD, DEC)"
      - X5.3: "Policy & Compliance"
    components:
      - COMP-STANDARDS
      - COMP-ECOSYSTEM
      - COMP-ORG-GOV
      - COMP-SHIVA-SPEC
      - COMP-VM-SPEC
      - COMP-ALGO-SPEC
      - COMP-DOCS

  - id: X6
    name: "Testing, Verification & Evidence"
    responsibility: >
      Unit, integration, system, and security testing, conformance checks,
      CI, artifact hashes, exact commits, and traceable verification evidence.
    sub_layers:
      - X6.1: "Unit & Integration Testing"
      - X6.2: "Conformance & Compliance Testing"
      - X6.3: "CI/CD & Evidence Pipeline"
    components:
      - COMP-ATC-ENG

  - id: X7
    name: "Observability & Reliability"
    responsibility: >
      Logs, metrics, traces, diagnostics, health checks, recovery,
      performance, and availability evidence.
    sub_layers:
      - X7.1: "Logging & Diagnostics"
      - X7.2: "Metrics & Health Checks"
      - X7.3: "Recovery & Reliability"
    components: []

  - id: X8
    name: "Build, Release & Supply Chain"
    responsibility: >
      Reproducible builds, dependencies, SBOM, signatures, release
      artifacts, update verification, and provenance.
    sub_layers:
      - X8.1: "Reproducible Builds & SBOM"
      - X8.2: "Release Management & Signing"
      - X8.3: "Dependency Management & Provenance"
    components: []

# ---------------------------------------------------------------------------
# INSTALLATION MODELS
# ---------------------------------------------------------------------------
installation_models:
  - id: "A"
    name: "Native System"
    description: >
      Hardware → Boot → ShivaCore → GlobusOS → Desktop → A-TownChain → Aurora AI.
      Full native stack from bare metal to applications.
    applies_to: [L0, L1, L2, L3, L4, L5, L6, L7, L8, L9, L10]

  - id: "B"
    name: "Windows Application"
    description: >
      A-TownChain components as native Windows applications with host-OS
      abstraction, process isolation, and compatible runtime components.
    applies_to: [L5, L6, L7, L8, L9]
    note: >
      Kernel subsystems (L0-L4) are NOT Windows applications. Only L5+
      components can run as Windows applications via host-OS abstraction.

  - id: "C"
    name: "Linux Application"
    description: >
      Linux host adapters, process and filesystem integration, and
      supported runtime components.
    applies_to: [L5, L6, L7, L8, L9]
    note: >
      Kernel subsystems (L0-L4) are NOT Linux applications. Only L5+
      components can run as Linux applications via host-OS abstraction.

  - id: "D"
    name: "Development & Test Environment"
    description: >
      Cross-compilation, emulators, virtual machines, local nodes,
      test networks, and CI environments.
    applies_to: [L0, L1, L2, L3, L4, L5, L6, L7, L8, L9, L10]

# ---------------------------------------------------------------------------
# CATALOG HIERARCHY (Ebenen der Katalog-Einträge)
# This is the catalog hierarchy for component and function entries,
# NOT additional operating system layers.
# ---------------------------------------------------------------------------
catalog_hierarchy:
  - level: 0
    name: "Haupt-Layer"
    example: "Hardware & Compute"
    id_format: "L{n}"
  - level: 1
    name: "Sub-Layer"
    example: "GPU Compute"
    id_format: "L{n}.{m}"
  - level: 2
    name: "Komponente"
    example: "GPU Driver Manager"
    id_format: "COMP-{NAME}"
  - level: 3
    name: "Subkomponente"
    example: "Device Discovery"
    id_format: "COMP-{NAME}-{SUB}"
  - level: 4
    name: "Funktionsvertrag"
    example: "discover_devices()"
    id_format: "FN-{COMP}-{n}"
  - level: 5
    name: "Schnittstellenvertrag"
    example: "Inputs, Outputs, Errors, Permissions"
    id_format: "IF-{FN}-{n}"
  - level: 6
    name: "Implementierung"
    example: "Exact repository path and symbol"
    id_format: "IMPL-{n}"
  - level: 7
    name: "Verifikation"
    example: "Tests, Workflow, Run/Job/Step, Exit-Code, Artifacts"
    id_format: "VER-{n}"

# ---------------------------------------------------------------------------
# VALIDATION RULES (fail-closed)
# ---------------------------------------------------------------------------
validation_rules:
  - id: VAL-LR-001
    rule: "Every component MUST have exactly one primary layer assignment."
    severity: FAIL
  - id: VAL-LR-002
    rule: "Every component MUST reference a valid layer ID from this registry."
    severity: FAIL
  - id: VAL-LR-003
    rule: "Every sub-layer MUST have a unique ID within its parent layer."
    severity: FAIL
  - id: VAL-LR-004
    rule: "Every component MUST declare supported installation models."
    severity: FAIL
  - id: VAL-LR-005
    rule: "Components assigned to L0-L4 MUST NOT claim Windows/Linux installation models."
    severity: FAIL
  - id: VAL-LR-006
    rule: "Every MAPPED/IMPLEMENTED/VERIFIED claim MUST have SSOT (repo, path, symbol, SHA)."
    severity: FAIL
  - id: VAL-LR-007
    rule: "Every VERIFIED claim MUST have evidence (tests, CI, hashes) bound to exact commit SHA."
    severity: FAIL
  - id: VAL-LR-008
    rule: "Source code existence alone does NOT qualify for VERIFIED status."
    severity: FAIL
  - id: VAL-LR-009
    rule: "Every UNRESOLVED or BLOCKED entry MUST have a documented reason."
    severity: FAIL
  - id: VAL-LR-010
    rule: "No duplicate implementations: one canonical SSOT per component."
    severity: FAIL

