      - id: L7.3
        name: "CLI & Developer Tools"
        description: "Command-line tools, project scaffolding, deployment scripts"
      - id: L7.4
        name: "IDE & Editor Support"
        description: "Language server, syntax highlighting, debugging, IDE integration"
    components:
      - COMP-LANG
      - COMP-TOOLCHAIN
      - COMP-SDK
      - COMP-IDE
    ssot_note: >
      ATCLang: A-TownChain-Okosystems/atclang (Rust core)
      Toolchain: A-TownChain-Okosystems/atc-toolchain
