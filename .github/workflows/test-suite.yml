name: ATC Test Suite (Skeleton-Smoke)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  skeleton-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ehrlicher Skeleton-Status (R1, F-102/F-108-Analog)
        run: |
          N=$(find . -name Cargo.toml -not -path "*/archive/*" | wc -l)
          RS=$(find . -name "*.rs" -not -path "*/archive/*" | wc -l)
          echo "atc-zkp: R1-Skeleton — $RS .rs-Dateien, $N Cargo-Manifest(e)"
          if [ "$N" -eq 0 ]; then
            echo "KEIN testbares Projekt: Test-Suite = ehrlicher Skeleton-Smoke (Implementierung folgt laut ROADMAP/Evidence)"
          fi
      - name: YAML-Validierung der Governance-Dateien
        run: |
          pip install pyyaml -q
          python3 - <<'PY'
          import glob, yaml
          n = 0
          for f in glob.glob("**/*.yaml", recursive=True):
              if "archive" in f: continue
              yaml.safe_load(open(f, encoding="utf-8")); n += 1
          print(f"YAML OK: {n} Dateien geparst")
          PY
      - name: Evidence-Bindung (SCR-0086: test_run BEI JEDEM LAUF aktualisieren + hartes Push-Gate)
        if: success()
        run: |
          python3 - <<'PY'
          import os, datetime, re
          sha = os.environ["GITHUB_SHA"]
          rid = os.environ["GITHUB_RUN_ID"]
          wf  = os.environ.get("GITHUB_WORKFLOW", "ATC Test Suite")
          ts  = datetime.datetime.now(datetime.timezone.utc).isoformat()
          p = ".atc/evidence/evidence.yaml"
          t = open(p, encoding="utf-8").read()
          t = re.sub(r"bound_commit: [^\n]*", "bound_commit: " + sha, t)
          block = ("test_run:\n"
                   "  workflow: " + wf + "\n"
                   "  run_id: " + rid + "\n"
                   "  commit: " + sha + "\n"
                   "  timestamp: " + ts + "\n"
                   "  result: PASS\n"
                   "  runner: github-actions\n")
          if re.search(r"(?m)^test_run:\n(?:  [^\n]*\n)+", t):
              t = re.sub(r"(?m)^test_run:\n(?:  [^\n]*\n)+", block, t)
          else:
              t = t.rstrip() + "\n" + block
          open(p, "w", encoding="utf-8").write(t)
          PY
          git config user.name "Aurora-Bot"
          git config user.email "aurora@base44.ai"
          git add .atc/evidence/evidence.yaml
          git commit -m "chore(evidence): bound_commit + test_run aktualisiert (SCR-0086) [skip ci]" || echo "nichts zu committen"
          git push
