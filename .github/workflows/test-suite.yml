name: ATC Test Suite
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: npm install + test/build (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            echo "=== npm in $d"
            (cd "$d" && npm install --no-audit --no-fund --silent)
            (cd "$d" && npm test --if-present --silent) || { echo "npm test FAILED in $d"; FAIL=1; }
            (cd "$d" && npm run build --if-present --silent) || { echo "npm build FAILED in $d"; FAIL=1; }
          done < <(find . -name package.json -not -path "*/archive/*" -not -path "*/node_modules/*" -not -path "*/.*/")
          exit $FAIL
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: pytest ueber alle Requirements-Module (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if ! (cd "$d" && grep -rql --include="*.py" "def test_" .); then
              echo "SKIP $d: keine Tests vorhanden"; continue
            fi
            echo "=== pytest in $d"
            (cd "$d" && pip install -q -r requirements.txt pytest && python -m pytest -q --no-header) \
              || { echo "pytest FAILED in $d"; FAIL=1; }
          done < <(find . -name requirements.txt -not -path "*/archive/*")
          exit $FAIL
      - name: Consensus-Boundary-Check (F-105, Report-Modus, SCR-0081)
        run: python3 tools/consensus_boundary_check.py
      - name: Evidence-Bindung (SCR-0086: test_run BEI JEDEM LAUF aktualisieren + hartes Push-Gate)
        if: success()
        run: |
          python3 - <<'PY'
          import os, datetime, re
          sha = os.environ["GITHUB_SHA"]
          rid = os.environ["GITHUB_RUN_ID"]
          wf  = os.environ.get("GITHUB_WORKFLOW", "ATC Test Suite")
          ts  = datetime.datetime.now(datetime.timezone.utc).isoformat()
          p = ".atc/evidence/evidence.yaml"
          t = open(p, encoding="utf-8").read()
          t = re.sub(r"bound_commit: [^\n]*", "bound_commit: " + sha, t)
          block = ("test_run:\n"
                   "  workflow: " + wf + "\n"
                   "  run_id: " + rid + "\n"
                   "  commit: " + sha + "\n"
                   "  timestamp: " + ts + "\n"
                   "  result: PASS\n"
                   "  runner: github-actions\n")
          if re.search(r"(?m)^test_run:\n(?:  [^\n]*\n)+", t):
              t = re.sub(r"(?m)^test_run:\n(?:  [^\n]*\n)+", block, t)
          else:
              t = t.rstrip() + "\n" + block
          open(p, "w", encoding="utf-8").write(t)
          PY
          git config user.name "Aurora-Bot"
          git config user.email "aurora@base44.ai"
          git add .atc/evidence/evidence.yaml
          git commit -m "chore(evidence): bound_commit + test_run aktualisiert (SCR-0086) [skip ci]" || echo "nichts zu committen"
          git push
