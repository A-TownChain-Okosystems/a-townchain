name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,rust
      - name: Build aller Cargo-Manifeste
        run: |
          while IFS= read -r f; do
            (cd "$(dirname "$f")" && cargo build --quiet)
          done < <(find . -name Cargo.toml -not -path "*/archive/*")
      - uses: github/codeql-action/analyze@v3
