name: Canonical L1 TX V2 Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "components/wallet/**"
      - "components/sdk/typescript/**"
      - "components/node/**"
      - "components/standards/**"
      - ".github/workflows/canonical-tx-v2.yml"

permissions:
  contents: read

jobs:
  canonical-tx-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TypeScript canonical vector
        working-directory: components/sdk/typescript
        run: npm test --silent

      - name: Wallet Rust canonical vector
        working-directory: components/wallet
        run: cargo test --all-targets --locked
