name: ATC ZKP Module CI

on:
  pull_request:
    paths:
      - "modules/atc-zkp/**"
      - ".github/workflows/atc-zkp-ci.yml"
  push:
    branches:
      - main
    paths:
      - "modules/atc-zkp/**"
      - ".github/workflows/atc-zkp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atc-zkp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atc-zkp-no-std:
    name: atc-zkp no_std build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record toolchain
        run: rustc --version && cargo --version

      - name: Compile no_std library
        run: cargo check --locked --manifest-path modules/atc-zkp/Cargo.toml --lib

      - name: Run atc-zkp unit tests
        run: cargo test --locked --manifest-path modules/atc-zkp/Cargo.toml --lib -- --test-threads=1
