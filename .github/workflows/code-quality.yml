# ATC Code Quality Gate — ATC-STD-081 (Coding) / ATC-STD-082 (Code Style), SCR-0123 Welle 2
# Profil-SSOT: ruff.toml (E,W,F,I; E501 ausstehend Welle 3) | ruff gepinnt 0.16.7
name: ATC Code Quality (STD-081/082)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Ruff installieren (gepinnt, ATC-STD-CI-001/CI-004)
        run: pip install ruff==0.16.7
      - name: Lint-Pruefung (ATC-STD-081)
        run: ruff check .
      - name: Format-Pruefung (ATC-STD-082)
        run: ruff format --check .
  vm:
    name: ATC-VM tests, clippy and evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve exact execution SHA
        id: revision
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            echo "sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact revision and record toolchain
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "EXECUTION_SHA=$actual" >> "$GITHUB_ENV"
          echo "commit=$actual"
          rustc --version
          cargo --version
      - name: ATC-VM tests
        run: cargo test --manifest-path components/vm/Cargo.toml --all-targets
      - name: ATC-VM clippy
        run: cargo clippy --manifest-path components/vm/Cargo.toml --all-targets -- -D warnings
      - name: Build immutable exact-head evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          git ls-tree -r --full-tree "$EXECUTION_SHA" components/vm > vm-source-tree.txt
          source_tree_sha256="$(sha256sum vm-source-tree.txt | cut -d ' ' -f 1)"
          cat > evidence/manifest.txt <<EOF
          workflow=ATC Code Quality (STD-081/082)
          run_id=$GITHUB_RUN_ID
          commit=$EXECUTION_SHA
          jobs=ATC-VM tests;ATC-VM clippy
          source_tree_file=vm-source-tree.txt
          source_tree_sha256=$source_tree_sha256
          rustc=$(rustc --version)
          cargo=$(cargo --version)
          result=PASS
          EOF
          sha256sum evidence/manifest.txt > evidence/manifest.sha256
      - name: Upload immutable ATC-VM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atc-vm-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
