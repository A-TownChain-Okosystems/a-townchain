name: Contract Exec Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  exec-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: A-TownChain-Okosystems/atc-contracts
          path: contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Bytecode assemblieren
        run: python3 contracts/exec_chain/assemble.py --contract contracts/exec_chain/e2e_adder.atc --vector contracts/exec_chain/vector.json --out build
      - name: ATVM-Execution mit Receipt-Verifikation
        run: |
          ATVM_OPS=build/e2e_adder.ops ATVM_OUT=build/receipt.json cargo run --quiet --example exec_receipt
          cat build/receipt.json
          grep -q '"status": "PASS"' build/receipt.json
      - name: Receipt archivieren
        uses: actions/upload-artifact@v4
        with:
          name: atvm-exec-receipt
          path: build/receipt.json
      - name: Evidence-Bindung (SCR-0104 idempotent)
        if: success()
        run: |
          python3 - <<'PY'
          import os, datetime, re
          sha = os.environ["GITHUB_SHA"]; rid = os.environ["GITHUB_RUN_ID"]
          wf = os.environ.get("GITHUB_WORKFLOW", "Contract Exec Gate")
          ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
          p = ".atc/evidence/evidence.yaml"
          t = open(p, encoding="utf-8").read()
          t = re.sub(r"bound_commit: [^\n]*", "bound_commit: " + sha, t)
          block = ("test_run:\n  workflow: " + wf + "\n  run_id: " + rid + "\n  commit: " + sha + "\n  timestamp: " + ts + "\n  result: PASS\n  runner: github-actions\n")
          if re.search(r"(?m)^test_run:\n(?:  [^\n]*\n)+", t):
              t = re.sub(r"(?m)^test_run:\n(?:  [^\n]*\n)+", block, t)
          else:
              t = t.rstrip() + "\n" + block
          open(p, "w", encoding="utf-8").write(t)
          PY
          mkdir -p .atc/evidence && cp build/receipt.json .atc/evidence/receipt_e2e_adder.json
          git config user.name "Aurora-Bot"
          git config user.email "aurora@base44.ai"
          git add .atc/evidence
          git commit -m "chore(evidence): EXEC-Gate-Receipt + bound_commit (SCR-0104, ATC-CONTRACT-EXEC-001) [skip ci]" || echo "nichts zu committen"
          git push
