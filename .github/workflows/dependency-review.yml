name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Standalone dependency graph and review
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/dependency_review.py --base "$GITHUB_BASE_SHA" --head HEAD --output dependency-graph.json
      - name: Upload dependency graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc-dependency-graph
          path: dependency-graph.json
          if-no-files-found: error
