name: SDK Build and Test
on:
  push:
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: TypeScript canonical TX V2 conformance
        working-directory: components/sdk/typescript
        run: npm test --silent

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo check --manifest-path components/sdk/Cargo.toml
      - name: Test
        run: cargo test --manifest-path components/sdk/Cargo.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

