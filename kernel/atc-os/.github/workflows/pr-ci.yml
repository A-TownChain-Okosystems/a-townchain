name: KAI-OS PR Validation

on:
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Linting & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Formatting
        working-directory: kai-os
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: kai-os
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Test Suite
        working-directory: kai-os
        run: cargo test --workspace --all-features

  layer-integrity:
    name: Monorepo Architecture Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate KAI-OS Monorepo Structure
        shell: bash
        run: |
          set -euo pipefail
          echo "Prüfe Monorepo-Verzeichnisstruktur..."

          test -d .github/workflows
          test -f AGENTS.md
          test -f ARCHITECTURE.md
          test -f GOVERNANCE.md
          test -f README.md

          if [ -f Cargo.toml ]; then
            cargo metadata --no-deps --format-version 1 >/dev/null
          else
            echo "Kein Root-Cargo-Workspace vorhanden; prüfe vorhandene Cargo-Manifeste."
            manifests=$(find . -name Cargo.toml -not -path './target/*' -print)
            test -n "$manifests"
            while IFS= read -r manifest; do
              cargo metadata --manifest-path "$manifest" --no-deps --format-version 1 >/dev/null
            done <<< "$manifests"
          fi
