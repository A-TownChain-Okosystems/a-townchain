  - id: "CONFLICT-002"
    subsystem_ids:
      - "SUB-GLOBUSOS-ATC-SHIVACORE"
    type: "LAYER_VIOLATION"
    severity: "HIGH"
    status: "RESIDUAL"
    component_a:
      domain: "SHIVACORE"
      repository: "A-TownChain-Okosystems/atc-shivacore"
      path: "ARCHITECTURE.md"
    component_b:
      domain: "GLOBUSOS"
      repository: "A-TownChain-Okosystems/globus-os"
      path: "modules/atc-shivacore/kernel/src/net.rs"
    conflict: "ShivaCore architecture explicitly places network protocol stacks outside the TCB, while the canonical integrated ShivaCore kernel contains Ethernet, ARP and IPv4 NetworkStack functionality."
    expected_architecture: "Kernel/TCB exposes minimal networking primitives/interfaces; network protocol stacks and policy live above the microkernel."
    observed_architecture: "The canonical kernel implements EthernetFrame, ArpTable, ArpPacket, NetworkDevice and NetworkStack including ARP/IPv4 handling."
    evidence:
      - "atc-shivacore: ARCHITECTURE.md states that network protocol stacks SHOULD remain outside the TCB."
      - "atc-shivacore: ARCHITECTURE.md states that ATCLang -> ATC-VM -> A-TownChain is separate from the ShivaCore kernel contract."
      - "globus-os: modules/atc-shivacore/kernel/src/net.rs implements Ethernet, ARP and IPv4 network-stack behavior."
    impact: "Protocol implementation inside the kernel expands the stated TCB boundary and conflicts with the OS-neutral microkernel contract."
    minimal_fix: "Separate hardware/network primitives from protocol implementation and expose a minimal kernel-facing network interface."
    verification:
      state: "ANALYZED"
      finding: "Direct source/documentation contradiction."
      root_cause: "Protocol-stack implementation is located inside the canonical ShivaCore kernel despite the documented TCB boundary."
      rerun: null

  - id: "CONFLICT-005"
    subsystem_ids:
      - "SUB-GLOBUSOS-ATC-SHIVACORE"
      - "SUB-ATC-ATC-BLOCKCHAIN"
    type: "CONTRADICTION"
    severity: "HIGH"
    status: "RESIDUAL"
    component_a:
      domain: "SHIVACORE"
      repository: "A-TownChain-Okosystems/atc-shivacore"
      path: "ARCHITECTURE.md"
    component_b:
      domain: "GLOBUSOS"
      repository: "A-TownChain-Okosystems/globus-os"
      path: "modules/atc-shivacore/kernel/src/vm.rs"
    conflict: "The ShivaCore architecture separates blockchain execution from the kernel contract, while the canonical kernel contains a contract VM with blockchain-specific operations and state."
    expected_architecture: "ATC-VM/blockchain execution remains outside the ShivaCore kernel/TCB; kernel VM facilities must be limited to hardware virtualization or userspace execution primitives."
    observed_architecture: "vm.rs defines ShivaVM, ContractRegistry, ContractStorage and opcodes including Balance and Transfer, with contract addresses, owner DIDs, balances and bytecode execution."
    evidence:
      - "atc-shivacore: ARCHITECTURE.md explicitly states that ATCLang -> ATC-VM -> A-TownChain is separate from the ShivaCore kernel contract."
      - "globus-os: modules/atc-shivacore/kernel/src/vm.rs defines ShivaVM and ContractRegistry."
      - "globus-os: modules/atc-shivacore/kernel/src/vm.rs includes Balance and Transfer opcodes plus contract balance/storage state."
    impact: "Blockchain contract semantics are directly coupled to the kernel module and can expand the TCB with chain-specific execution semantics."
    minimal_fix: "Remove blockchain contract execution from the kernel boundary or relocate it to the canonical ATC-VM/service layer; retain only clearly defined userspace/virtualization primitives in the kernel."
    verification:
      state: "ANALYZED"
      finding: "Function-level source inspection confirms that vm.rs is a blockchain contract VM, not merely a hardware virtualization helper."
      root_cause: "A blockchain contract-execution implementation was placed under the ShivaCore kernel source tree."
      rerun: null

  - id: "CONFLICT-006"
    subsystem_ids:
      - "SUB-GLOBUSOS-ATC-SHIVACORE"
    type: "DUPLICATE_VERIFICATION"
    severity: "MEDIUM"
    status: "RESIDUAL"
    component_a:
      domain: "GLOBUSOS"
      repository: "A-TownChain-Okosystems/globus-os"
      path: ".github/workflows/rust-ci.yml"
    component_b:
      domain: "GLOBUSOS"
      repository: "A-TownChain-Okosystems/globus-os"
      path: ".github/workflows/shivacore-kernel.yml"
    conflict: "The canonical ShivaCore kernel is independently validated by the general Rust CI workflow and the dedicated ShivaCore boot workflow."
    expected_architecture: "Kernel verification must have explicit gate authority and evidence semantics; overlapping workflows must be classified as authoritative, prerequisite or supplemental."
    observed_architecture: "rust-ci.yml runs kernel library tests and clippy, while shivacore-kernel.yml builds the kernel and performs BIOS/UEFI and QEMU CPU/scheduler smoke checks."
    evidence:
      - "globus-os: .github/workflows/rust-ci.yml contains ShivaCore kernel library tests and ShivaCore kernel clippy."
      - "globus-os: .github/workflows/shivacore-kernel.yml builds the kernel and performs Intel/AMD QEMU smoke validation."
    impact: "Overlapping verification can produce ambiguous gate ownership and duplicate evidence unless the relationship is explicitly defined."
    minimal_fix: "Declare authoritative versus supplemental kernel verification responsibilities and make the release/evidence chain consume the authoritative result."
    verification:
      state: "ANALYZED"
      finding: "Overlapping verification paths are directly evidenced; actual release-blocking dependency is not yet proven."
      root_cause: "Two workflows independently validate different aspects of the same canonical kernel."
      rerun: null

matrix_rules:
  - "Do not mark a conflict FIXED from documentation alone."
  - "RESOLVED means the conflict condition is directly absent from the current source-of-truth state; it does not claim exact-SHA CI verification."
  - "FIXED requires a minimal source/architecture fix plus exact-SHA rerun/verification evidence."
  - "Do not infer runtime deadlocks or cycles from filenames alone."
  - "A RESIDUAL conflict remains open until its minimal fix is committed and exact-SHA rerun evidence exists."
  - "Finding evidence, error-log evidence and verification evidence remain separate."
  - "Every conflict must reference one or more canonical subsystem IDs from SUBSYSTEM-MATRIX.yaml."
