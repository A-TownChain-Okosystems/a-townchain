scope: "Verified architectural contradictions, duplicate ownership, boundary violations and potentially blocking component interactions across the five core domains."
evidence_rule: "A conflict is recorded only when the conflicting behavior/boundary is directly evidenced by repository source or architecture documentation. Suspected conflicts are not promoted to VERIFIED_CONFLICT."
