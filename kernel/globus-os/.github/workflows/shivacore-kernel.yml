name: ShivaCore Kernel Boot

on:
  push:
    branches: [main]
    paths:
      - "modules/atc-shivacore/kernel/**"
      - "modules/atc-shivacore/boot/**"
      - "Cargo.toml"
      - ".github/workflows/shivacore-kernel.yml"
  pull_request:
    paths:
      - "modules/atc-shivacore/kernel/**"
      - "modules/atc-shivacore/boot/**"
      - "Cargo.toml"
      - ".github/workflows/shivacore-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: Build and smoke-test ShivaCore (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: intel-skylake
            qemu_cpu: Skylake-Client-v1
            expected_vendor: Intel
          - cpu: amd-epyc
            qemu_cpu: EPYC
            expected_vendor: AMD
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: llvm-tools-preview, rust-src

      - name: Build kernel ELF
        id: build_kernel
        env:
          RUSTFLAGS: '-C target-cpu=x86-64 --cfg curve25519_dalek_backend="serial"'
        run: |
          cargo build -p shivacore --release \
            --target x86_64-unknown-none \
            --features x86-boot

      - name: Build BIOS and UEFI images
        id: build_images
        run: |
          mkdir -p target/boot-images
          cargo run -p boot --release -- \
            target/x86_64-unknown-none/release/shivacore \
            target/boot-images

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Verify QEMU CPU model
        run: qemu-system-x86_64 -cpu help | grep -E '^[[:space:]]*x86[[:space:]]+${{ matrix.qemu_cpu }}([[:space:]]|$)'

      - name: BIOS boot smoke test (${{ matrix.cpu }})
        id: bios_smoke
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -cpu ${{ matrix.qemu_cpu }} \
            -drive format=raw,file=target/boot-images/shivacore-bios.img \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown 2>&1 | tee target/shivacore-qemu-${{ matrix.cpu }}.log
          status=${PIPESTATUS[0]}
          echo "qemu_exit_code=$status" >> "$GITHUB_OUTPUT"
          if ! grep -q "ShivaCore: Kernel-Einstiegspunkt erreicht." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "ShivaCore did not reach kernel_main."
            exit 1
          fi
          if ! grep -q "ShivaCore: CPU vendor=${{ matrix.expected_vendor }} " target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "CPU vendor detection did not match expected ${{ matrix.expected_vendor }}."
            cat target/shivacore-qemu-${{ matrix.cpu }}.log
            exit 1
          fi
          if ! grep -q "ShivaCore: CPU HAL compatibility check OK." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "CPU HAL compatibility gate did not pass."
            exit 1
          fi

          if ! grep -q "ShivaCore: ACPI RSDP/root/table checksums validated; tables=" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "ACPI RSDP/root/child-table validation did not pass in BIOS guest."
            cat target/shivacore-qemu-${{ matrix.cpu }}.log
            exit 1
          fi
          if ! grep -q "ShivaCore: USER-001 mapped PID=1000" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "USER-001 did not install the first Ring-3 process."
            exit 1
          fi
          if ! grep -q "ShivaCore: SCHED-001 scheduler armed: PID=1000 + PID=1001" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "SCHED-001 scheduler was not armed with two Ring-3 processes."
            exit 1
          fi
          if ! grep -q "ShivaCore: USER-001 entering PID=1000" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Kernel did not attempt the real Ring-3 IRETQ entry."
            exit 1
          fi
          if ! grep -q "ShivaCore: scheduler preemption -> context switch to PID=1001" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Timer IRQ did not drive a real scheduler preemption to PID=1001."
            exit 1
          fi
          if ! grep -q "ShivaCore: scheduler preemption -> context switch to PID=1000" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Timer IRQ did not complete the round-trip back to PID=1000."
            exit 1
          fi
          if ! grep -q "ShivaCore: SCHED-001 register checkpoint PID=1000 RAX=0x1000 RBX=0x1001 R12=0x1012" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "PID=1000 register checkpoint was not preserved."
            exit 1
          fi
          if ! grep -q "ShivaCore: SCHED-001 register checkpoint PID=1001 RAX=0x2000 RBX=0x2001 R12=0x2012" target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "PID=1001 register checkpoint was not preserved."
            exit 1
          fi
          if ! grep -q "ShivaCore: KernelState::boot() -> Done." target/shivacore-qemu-${{ matrix.cpu }}.log; then
            echo "Canonical KernelState::boot() was not reached from kernel_main."
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $status."
            exit "$status"
          fi

      - name: Locate OVMF UEFI firmware
        id: ovmf
        run: |
          firmware="$(find /usr/share/OVMF /usr/share/ovmf /usr/share/edk2 -type f \
            \( -name 'OVMF_CODE*.fd' -o -name 'edk2-x86_64-code.fd' \) \
            ! -iname '*vars*' 2>/dev/null | sort | head -n 1)"
          if [ -z "$firmware" ]; then
            echo "No OVMF code firmware found after installing ovmf."
            find /usr/share -maxdepth 4 -type f -iname '*ovmf*' -print || true
            exit 1
          fi
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "Using OVMF firmware: $firmware"

      - name: UEFI boot smoke test (${{ matrix.cpu }})
        id: uefi_smoke
        env:
          OVMF_CODE: ${{ steps.ovmf.outputs.firmware }}
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -cpu ${{ matrix.qemu_cpu }} \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive format=raw,file=target/boot-images/shivacore-uefi.img \
            -serial stdio \
            -display none \
            -no-reboot \
            -no-shutdown 2>&1 | tee target/shivacore-uefi-${{ matrix.cpu }}.log
          status=${PIPESTATUS[0]}
          echo "qemu_exit_code=$status" >> "$GITHUB_OUTPUT"
          log=target/shivacore-uefi-${{ matrix.cpu }}.log
          if ! grep -q "ShivaCore: Kernel-Einstiegspunkt erreicht." "$log"; then
            echo "UEFI boot did not reach kernel_main."
            cat "$log"
            exit 1
          fi
          if ! grep -q "ShivaCore: CPU vendor=${{ matrix.expected_vendor }} " "$log"; then
            echo "UEFI CPU vendor detection did not match expected ${{ matrix.expected_vendor }}."
            cat "$log"
            exit 1
          fi
          for expected in \
            "ShivaCore: CPU HAL compatibility check OK." \
            "ShivaCore: ACPI RSDP/root/table checksums validated; tables=" \
            "ShivaCore: KernelState::boot() -> Done." \
            "ShivaCore: USER-001 mapped PID=1000" \
            "ShivaCore: SCHED-001 scheduler armed: PID=1000 + PID=1001" \
            "ShivaCore: USER-001 entering PID=1000" \
            "ShivaCore: scheduler preemption -> context switch to PID=1001" \
            "ShivaCore: scheduler preemption -> context switch to PID=1000" \
            "ShivaCore: SCHED-001 register checkpoint PID=1000 RAX=0x1000 RBX=0x1001 R12=0x1012" \
            "ShivaCore: SCHED-001 register checkpoint PID=1001 RAX=0x2000 RBX=0x2001 R12=0x2012"; do
            if ! grep -Fq "$expected" "$log"; then
              echo "UEFI boot acceptance marker missing: $expected"
              cat "$log"
              exit 1
            fi
          done
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "UEFI QEMU exited unexpectedly with status $status."
            exit "$status"
          fi

      - name: Create SHA-bound boot evidence manifest
        id: boot_evidence
        if: always()
        shell: bash
        env:
          BUILD_KERNEL_OUTCOME: ${{ steps.build_kernel.outcome || 'unknown' }}
          BUILD_IMAGES_OUTCOME: ${{ steps.build_images.outcome || 'unknown' }}
          BIOS_SMOKE_OUTCOME: ${{ steps.bios_smoke.outcome || 'unknown' }}
          BIOS_QEMU_EXIT_CODE: ${{ steps.bios_smoke.outputs.qemu_exit_code || 'not-recorded' }}
          UEFI_SMOKE_OUTCOME: ${{ steps.uefi_smoke.outcome || 'unknown' }}
          UEFI_QEMU_EXIT_CODE: ${{ steps.uefi_smoke.outputs.qemu_exit_code || 'not-recorded' }}
        run: |
          set -u
          mkdir -p target/boot-evidence
          manifest="target/boot-evidence/manifest-${{ matrix.cpu }}.txt"
          {
            echo "schema=globusos.boot-evidence.v1"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "github_sha=${GITHUB_SHA:-unknown}"
            echo "workflow_ref=${GITHUB_WORKFLOW_REF:-unknown}"
            echo "workflow_sha=${GITHUB_WORKFLOW_SHA:-unknown}"
            echo "run_id=${GITHUB_RUN_ID:-unknown}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "job=${GITHUB_JOB:-unknown}"
            echo "matrix_cpu=${{ matrix.cpu }}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "build_kernel_outcome=$BUILD_KERNEL_OUTCOME"
            echo "build_images_outcome=$BUILD_IMAGES_OUTCOME"
            echo "bios_smoke_outcome=$BIOS_SMOKE_OUTCOME"
            echo "bios_qemu_exit_code=$BIOS_QEMU_EXIT_CODE"
            echo "uefi_smoke_outcome=$UEFI_SMOKE_OUTCOME"
            echo "uefi_qemu_exit_code=$UEFI_QEMU_EXIT_CODE"
            echo "secure_boot_status=RESIDUAL_NOT_ASSERTED"
            echo "acpi_guest_validation=RESIDUAL_NOT_ASSERTED"
            echo "bare_metal_status=NOT_TESTED_BY_QEMU"
            echo "artifact_sha256_begin"
            for artifact in \
              target/boot-images/shivacore-bios.img \
              target/boot-images/shivacore-uefi.img \
              "target/shivacore-qemu-${{ matrix.cpu }}.log" \
              "target/shivacore-uefi-${{ matrix.cpu }}.log"; do
              if [ -f "$artifact" ]; then
                sha256sum "$artifact"
              else
                echo "MISSING  $artifact"
              fi
            done
            echo "artifact_sha256_end"
          } > "$manifest"
          cat "$manifest"

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shivacore-boot-images-${{ matrix.cpu }}
          path: |
            target/boot-images/shivacore-bios.img
            target/boot-images/shivacore-uefi.img
            target/shivacore-qemu-${{ matrix.cpu }}.log
            target/shivacore-uefi-${{ matrix.cpu }}.log
            target/boot-evidence/manifest-${{ matrix.cpu }}.txt
