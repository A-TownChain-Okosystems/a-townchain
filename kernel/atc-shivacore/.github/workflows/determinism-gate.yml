name: Determinism Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run ATC determinism gate
        run: python3 tools/determinism_check.py --lang rust --test-cmd "cargo test --manifest-path modules/atc-security/Cargo.toml --quiet"
