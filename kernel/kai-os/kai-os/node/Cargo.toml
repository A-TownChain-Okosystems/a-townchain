[package]
name = "kai-os-node"
version = "0.1.0"
edition = "2021"
description = "KAI-OS Node Daemon — Orchestrierungsebene (S01-S03, AD-008)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
