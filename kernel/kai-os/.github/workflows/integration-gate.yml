name: Integration Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kai-os
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace integration tests
        run: cargo test --workspace --quiet --locked
