# Dependabot-Konfiguration — AUD-2026-0002 F-025 (ATC-STD-203 Security)
version: 2
updates:
  - package-ecosystem: cargo
    directory: "modules/atc-assets"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "modules/atc-dex"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
