name: ATC Test Suite

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  atclang-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out merged ATCLang parser commit
        uses: actions/checkout@v4
        with:
          repository: A-TownChain-Okosystems/atclang
          ref: c84862e18b8782dcd2aebd403de630ba47f71b88
          path: atclang
      - uses: dtolnay/rust-toolchain@stable
      - name: Build canonical ATCLang CLI
        working-directory: atclang
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/atclang/target
        run: cargo build --release --manifest-path crates/atc-core/Cargo.toml
      - name: Run ATCLang consensus conformance
        env:
          ATCLANG_ROOT: ${{ github.workspace }}/atclang
        run: bash tests/run_atclang_conformance.sh

  exec-chain-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: A-TownChain-Okosystems/atc-vm
          path: atc-vm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native ATVM runner
        working-directory: atc-vm
        run: cargo build --locked --bin atc-vm-runner
      - name: Run migrated EXEC-CHAIN tests
        env:
          ATC_VM_RUNNER: ${{ github.workspace }}/atc-vm/target/debug/atc-vm-runner
        run: bash exec_chain/tests/run_tests.sh

  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: npm install + test/build (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            echo "=== npm in $d"
            (cd "$d" && npm install --no-audit --no-fund --silent)
            (cd "$d" && npm test --if-present --silent) || { echo "npm test FAILED in $d"; FAIL=1; }
            (cd "$d" && npm run build --if-present --silent) || { echo "npm build FAILED in $d"; FAIL=1; }
          done < <(find . -name package.json -not -path "*/archive/*" -not -path "*/node_modules/*" -not -path "*/.*/")
          exit $FAIL

  evidence:
    needs: [atclang-conformance, exec-chain-native, npm-tests]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable evidence artifact
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import os, datetime, re
          sha = os.environ["GITHUB_SHA"]
          rid = os.environ["GITHUB_RUN_ID"]
          wf = os.environ.get("GITHUB_WORKFLOW", "ATC Test Suite")
          ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
          t = open(".atc/evidence/evidence.yaml", encoding="utf-8").read()
          t = re.sub(r"bound_commit: [^\n]*", "bound_commit: " + sha, t)
          block = ("test_run:\n  workflow: " + wf + "\n  run_id: " + rid + "\n  commit: " + sha + "\n  timestamp: " + ts + "\n  result: PASS\n  runner: github-actions\n")
          if re.search(r"(?m)^test_run:\n(?:  [^\n]*\n)+", t):
              t = re.sub(r"(?m)^test_run:\n(?:  [^\n]*\n)+", block, t)
          else:
              t = t.rstrip() + "\n" + block
          open("evidence/evidence.yaml", "w", encoding="utf-8").write(t)
          PY
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: atc-contracts-evidence-${{ github.sha }}
          path: evidence/evidence.yaml
          if-no-files-found: error
