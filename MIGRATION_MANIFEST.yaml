schema_version: "1.0"
status: "migration-prepared"
target_repository: "A-TownChain-Okosystems/a-townchain"
strategy: "namespaced-components"
root_core: "a-townchain"
components:
  - source: "A-TownChain-Okosystems/atc-node"
    target: "components/node"
  - source: "A-TownChain-Okosystems/atc-algorithm"
    target: "components/algorithm"
  - source: "A-TownChain-Okosystems/atc-vm"
    target: "components/vm"
  - source: "A-TownChain-Okosystems/atc-contracts"
    target: "components/contracts"
  - source: "A-TownChain-Okosystems/atc-sdk"
    target: "components/sdk"
  - source: "A-TownChain-Okosystems/atc-wallet"
    target: "components/wallet"
  - source: "A-TownChain-Okosystems/atc-explorer"
    target: "components/explorer"
  - source: "A-TownChain-Okosystems/atc-indexer"
    target: "components/indexer"
  - source: "A-TownChain-Okosystems/atc-mining"
    target: "components/mining"
  - source: "A-TownChain-Okosystems/atc-oracle"
    target: "components/oracle"
  - source: "A-TownChain-Okosystems/atc-storage"
    target: "components/storage"
  - source: "A-TownChain-Okosystems/atc-interop"
    target: "components/interop"
  - source: "A-TownChain-Okosystems/atc-zkp"
    target: "components/zkp"

rules:
  preserve_git_history: true
  do_not_delete_source_repositories: true
  validate_before_decommission: true
  dependency_graph: "use-when-available"
  source_of_truth: "a-townchain"
