# Aufgaben, die das Register nicht fuehrt, die die Bestandsaufnahme aber
# nachweisbar erzeugt hat (Zaehlung, Triage, SSOT-Grenzen).
additional:
  - id: ATC-TASK-P0-101
    title: "PR-Triage: 244 offene PRs klassifizieren und schliessen"
    priority: P0
    ssot: "A-TownChain-Okosystems (org-weit)"
    phase: 0
    depends_on: []
    status: OPEN
    problem: "244 offene PRs blockieren Review-Kapazitaet. Ohne Klassifikation ist keine Aussage moeglich, welche Aenderung noch gilt."
    acceptance_criteria:
      - "Jeder der 244 PRs hat genau eine Klasse: relevant, ueberholt, Duplikat, Sicherheitskorrektur, Dokumentation, abnahmebereit, blockiert."
      - "Jeder PR ohne Klasse ist als offen markiert, nicht stillschweigend geschlossen."
      - "Ueberholte PRs sind mit Verweis auf den ersetzenden PR oder Commit geschlossen."
    evidence_required: "Triage-Bericht mit PR-Nummer, Klasse, Begruendung, Zeitstempel"

  - id: ATC-TASK-P0-102
    title: "Issue-Triage: 149 offene Issues auf Duplikate, Erledigung und Abhaengigkeiten pruefen"
    priority: P0
    ssot: "A-TownChain-Okosystems (org-weit)"
    phase: 0
    depends_on: []
    status: OPEN
    problem: "13 P0- und 10 P1-Issues sind nicht gegen den Code-Stand abgeglichen; Doppelungen mit dem Blocker-Register sind unbekannt."
    acceptance_criteria:
      - "Jedes offene Issue ist einem Blocker oder einer Task-ID zugeordnet oder als eigenstaendig begruendet."
      - "Bereits erledigte Issues sind mit Commit-Nachweis geschlossen."
      - "Doppelte Issues sind zusammengefuehrt, nicht geloescht."
    evidence_required: "Triage-Bericht mit Issue-Nummer, Zuordnung, Commit-Nachweis"

  - id: ATC-TASK-P1-101
    title: "Governance-Abdeckung gegen den Live-Bestand reconciliieren"
    priority: P1
    ssot: ".github (Org)"
    phase: 0
    depends_on: [BLK-P2-03]
    status: OPEN
    problem: "Der Bericht nennt 4 von 26 Repositories geschuetzt. Live geprueft am 2026-11-19 sind 25 von 26 geschuetzt; ungeschuetzt ist nur demo-repository. Die veroeffentlichte Abdeckungsquote ist damit falsch."
    acceptance_criteria:
      - "Die Abdeckungsquote im Register stammt aus einer Live-Abfrage, nicht aus einer Momentaufnahme vom 17.11."
      - "demo-repository ist entweder geschuetzt oder als Ausnahme mit Begruendung gefuehrt."
      - "Die Zahl ist mit Abfragezeitpunkt und Methode belegt."
    evidence_required: "API-Abfrage je Repository mit Zeitstempel und Ergebnis"

  - id: ATC-TASK-P1-102
    title: "SSOT-Freeze: atc-vm und atc-algorithm duerfen nicht parallel weiterentwickelt werden"
    priority: P1
    ssot: "a-townchain/components/vm"
    phase: 0
    depends_on: []
    status: OPEN
    problem: "atc-vm (main 21132a49, 25.09.) und atc-algorithm (main f25b4338, 13.10.) stehen still, waehrend der Monorepo die kanonischen Pfade fuehrt. Ohne sichtbaren Freeze entstehen neue Kopien."
    acceptance_criteria:
      - "Beide Repositories tragen eine sichtbare Freeze-Notiz im README mit Verweis auf den kanonischen Pfad."
      - "Branch Protection oder Archivierung verhindert neue Commits auf main."
      - "Die kanonischen Pfade im Monorepo sind im Register als SSOT eingetragen."
    evidence_required: "README-Commit je Repository, Schutz- oder Archiv-Status mit Abfragezeitpunkt"

  - id: ATC-TASK-P1-103
    title: "Zustaendigkeit der sieben archivierten Repositories uebertragen"
    priority: P1
    ssot: "a-townchain (Monorepo)"
    phase: 0
    depends_on: []
    status: OPEN
    problem: "atc-wallet, atc-explorer, atc-indexer, atc-mining, atc-interop, atc-oracle und atc-storage sind archiviert. Ihre Funktionen muessen einen aktiven Eigentuemer haben, sonst ist die Abdeckung unbelegt."
    acceptance_criteria:
      - "Fuer jedes der sieben Repositories ist die aktive Nachfolgekomponente benannt."
      - "Jede Nachfolgekomponente ist im Monorepo vorhanden und baut."
      - "Kein Repository bleibt ohne Zuordnung."
    evidence_required: "Zuordnungstabelle mit Repository, Nachfolger, Build-Nachweis"

  - id: ATC-TASK-P2-101
    title: "Register-Zaehlung korrigieren: 31 Eintraege, nicht 15 und nicht 32"
    priority: P2
    ssot: "a-townchain-ecosystem"
    phase: 0
    depends_on: []
    status: OPEN
    problem: "PR #247 nennt 15 Blocker, die Bestandsaufnahme 32, der gepinnte Snapshot enthaelt 31 Eintraege. Vier Eintraege (BLK-P1-05, BLK-P2-08, BLK-P2-09, BLK-P2-10) haben kein priority-Feld."
    acceptance_criteria:
      - "Die Zahl im PR-Text, im Register und im Statusgenerator ist identisch."
      - "Jeder Eintrag hat die Felder id, title, priority, status, closure_criteria."
      - "Der Statusgenerator zaehlt aus der YAML, nicht aus Prosa."
    evidence_required: "Generator-Lauf mit Ausgabe der Zaehlung und Validator-Ergebnis"

  - id: ATC-TASK-P2-102
    title: "Nachweise der vier geschlossenen Blocker an den Fix-Commit binden"
    priority: P2
    ssot: "a-townchain-ecosystem"
    phase: 0
    depends_on: [ATC-TASK-P2-101]
    status: OPEN
    problem: "BLK-P0-01, BLK-P1-05, BLK-P2-08 und BLK-P2-09 stehen auf CLOSED, ihre Evidence zeigt aber nur auf den Branch-HEAD (5a9add0e bzw. 5ef28537), nicht auf den Commit, der den Blocker geschlossen hat. Damit ist die Schliessung nicht nachvollziehbar."
    acceptance_criteria:
      - "Jeder der vier Blocker nennt den Commit, der die Ursache behebt, mit vollstaendigem SHA."
      - "Zu jedem dieser Commits existiert ein Workflow-Run mit Job und Exit-Code."
      - "Der Register-Generator uebernimmt den Fix-Commit, nicht den Branch-HEAD."
    evidence_required: "Vier Blocker-Eintraege mit Fix-Commit, Workflow-Run, Job, Exit-Code"

corrections:
  - claim: "4 von 26 aktiven Repositories geschuetzt, 22 ohne Branch Protection"
    live_result: "25 von 26 geschuetzt; ungeschuetzt ist nur demo-repository"
    method: "GitHub API /repos/{org}/{repo}/branches/main/protection, 26 aktive Repositories, 2026-11-19"
    impact: "Die Aussage zur Governance-Abdeckung ist falsch und darf so nicht veroeffentlicht werden."
  - claim: "Das Register enthaelt 32 Blocker-Eintraege"
    live_result: "31 Eintraege im gepinnten Snapshot (PR #247, head d691e51d)"
    method: "yaml.safe_load auf docs/system-readiness/BLOCKER_REGISTER.yaml, len(blockers)"
    impact: "Zaehlung in Bericht und Register stimmt nicht ueberein."
  - claim: "Der PR-Text nennt 15 Blocker"
    live_result: "31 Eintraege in der YAML, davon 4 CLOSED"
    method: "Vergleich PR-Beschreibung gegen Dateiinhalt"
    impact: "Bestaetigt: PR-Zusammenfassung bildet die Datei nicht ab."
