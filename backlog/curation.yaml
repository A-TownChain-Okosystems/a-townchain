# ============================================================================
# Kuratierungs-Ebene des Master-Backlogs.
# Hier steht NUR, was das Quell-Register nicht enthaelt:
#   ssot      — kanonischer Eigentuemer der Aufgabe (ein Repo/Pfad, nie zwei)
#   phase     — Reihenfolge nach dem Entwicklungsfahrplan (0..7)
#   depends_on— harte Abhaengigkeiten auf andere Task-IDs
#   status_override / note — nur wenn der Live-Stand vom Register abweicht
# Die inhaltliche Wahrheit (Titel, Problem, Closure-Kriterien, Evidence) kommt
# aus dem gepinnten Register-Snapshot, nicht aus dieser Datei.
# ============================================================================
