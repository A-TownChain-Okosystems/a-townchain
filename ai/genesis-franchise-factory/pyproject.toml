[project]
name = "genesis-franchise-factory"
version = "0.1.0"
description = "Genesis Franchise Factory (GFF) — Content-Pipeline-Orchestrator des Genesis-Oekosystems (AD-20..AD-43, 23 Factories + 2 Cores, ATC-9900 DAO-Modell)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gff*"]
