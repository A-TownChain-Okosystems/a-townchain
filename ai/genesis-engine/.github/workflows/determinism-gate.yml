name: Determinism Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run ATC determinism gate
        run: python3 tools/determinism_check.py --lang python --test-cmd "python3 -m pytest -q 2>/dev/null || python3 -m unittest discover -q"
