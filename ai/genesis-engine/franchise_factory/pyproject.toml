[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-genesis-franchise-factory"
version = "0.1.0"
description = "Genesis Franchise Factory integrated into Genesis Engine"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["gff"]
