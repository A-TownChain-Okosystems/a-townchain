$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://a-townchain.org/schemas/aurora-action-request-v1.yaml"
title: Aurora Action Request
type: object
additionalProperties: false
required:
  - request_id
  - principal
  - capability
  - action
  - scope
properties:
  request_id:
    type: string
    minLength: 1
  principal:
    type: string
    minLength: 1
  capability:
    type: string
    minLength: 1
  action:
    type: string
    minLength: 1
  scope:
    type: string
    minLength: 1
description: >
  Untrusted action-request envelope. It carries no approval boolean or approval
  grant: only the trusted approval subsystem may mint a request-scoped grant.
  Model output is never an authorization source. Unknown or mismatched context
  MUST fail closed. This envelope does not replace ATC-AI-CAP-001 capability
  tokens, revocation, expiry, nonce/replay checks, audience validation, or
  ShivaCore enforcement.
