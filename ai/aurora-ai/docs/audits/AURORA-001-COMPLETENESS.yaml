schema: AURORA-001
version: "1.0.0"
title: "Aurora Platform Completeness & Authority Gate"
status: active
owner: A-TownChain-Okosystems
principle: "No Evidence, No Trust"

status_order:
  - MISSING
  - ARCHITECTURE_ONLY
  - SPECIFIED
  - IMPLEMENTED
  - TESTED
  - CI_VERIFIED
  - INTEGRATED
  - E2E_VERIFIED

exceptional_status:
  - BLOCKED
  - DUPLICATE
  - DISCONNECTED

evidence_requirements:
  architecture:
    required: true
  canonical_module:
    required: true
    unique: true
  source_symbol:
    required: true
    exact_reference: true
  interface_contract:
    required: true
  tests:
    unit_or_integration_required: true
  ci:
    exact_commit_required: true
    passing_required: true
  security:
    required_for_authority_and_execution: true
  e2e:
    required_for_integrated_status: true

authority_model:
  model:
    proposes: true
    executes: false
    authorizes: false
  agent:
    requests: true
    executes: false
    authorizes: false
  capability:
    requires_policy_check: true
  policy:
    checks: true
    is_execution_authority: false
  approval:
    may_be_required: true
    authorizes: true
  tool:
    executes: true
    requires_authorization: true

system_boundaries:
  aurora_kernel_authority: false
  aurora_consensus_authority: false
  direct_aurora_shivacore_access: false
  required_os_boundary:
    - Aurora
    - GlobusOS
    - ShivaCore
  required_blockchain_path:
    - Aurora
    - A-TownChain Interface
    - Node
    - Consensus
    - ATC-VM
    - State

rules:
  file_exists_is_implementation: false
  documentation_is_implementation: false
  module_directory_is_implementation: false
  test_without_source_is_implementation: false
  ci_without_exact_commit_is_evidence: false
  mock_execution_is_production_execution: false
  direct_kernel_access_is_allowed: false
  direct_consensus_access_is_allowed: false
  unauthorized_tool_execution_is_allowed: false
  disconnected_source_is_integrated: false
  duplicate_source_is_canonical: false

