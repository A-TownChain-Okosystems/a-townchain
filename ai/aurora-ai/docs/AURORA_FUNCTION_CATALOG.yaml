architecture_invariants:
  - "Aurora is user-space AI, not ShivaCore TCB, kernel authority, blockchain consensus, or canonical ATC-VM."
  - "Intent/Proposal -> Policy -> Capability Check -> Approval when required -> Tool/Service Boundary -> authoritative runtime."
  - "Fail closed if policy, capability, required approval, or trusted evidence is missing."
  - "Model output and retrieved content are untrusted data and cannot grant authority."
scope_note: "Conservative snapshot of inspected files, not a complete recursive repository census."
