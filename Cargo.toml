# Root-Workspace des a-townchain-Monorepos.
# Kanonisch sind components/, modules/, tooling/ und die Produkt-Apps.
# apps/-Spiegel bereits vorhandener components-Crates, die sieben Unter-Workspaces
# und das Archiv bleiben ausserhalb und werden ueber ihre eigenen Manifeste gebaut.
[workspace]
resolver = "2"
members = [
    "ai/atclang/crates/atc-core",
    "ai/aurora-ai/modules/atc-aurora-agents",
    "ai/aurora-ai/modules/atc-aurora-core",
    "ai/aurora-ai/modules/atc-aurora-localization",
    "ai/aurora-ai/modules/atc-aurora-memory",
    "ai/aurora-ai/sdk",
    "ai/genesis-chronicles/modules/atc-game",
    "apps/atc-compute",
    "apps/atc-launchpad",
    "components/algorithm",
    "components/interop/modules/atc-bridge",
    "components/mining",
    "components/node",
    "components/oracle",
    "components/sdk",
    "components/sdk/modules/atc-cli",
    "components/sdk/modules/atc-sdk/rust",
    "components/storage",
    "components/vm",
    "components/wallet",
    "docs/os-docs/docs/archive/repos-rescue/archiviert-atc-kernel",
    "docs/os-docs/docs/archive/shiva-os/crates/shiva-data-analyst",
    "docs/os-docs/docs/archive/shiva-os/crates/shiva-marketplace",
    "docs/os-docs/docs/archive/shiva-os/crates/shiva-security",
    "docs/os-docs/docs/archive/shiva-os/crates/shiva-visualization",
    "docs/os-docs/docs/monorepo-legacy/src-legacy/shivacore/kernel",
    "ecosystem/integration",
    "kernel/atc-shivacore/modules/atc-security",
    "kernel/atc-shivacore/sdk",
    "modules/atc-blockchain/kernel",
    "modules/atc-dns",
    "modules/atc-governance",
    "modules/atc-zkp",
    "standards/sdk",
]
exclude = [
    "ai/genesis-engine",
    "apps/atc-marketplace",
    "components/zkp",
    "docs/os-docs/docs/archive/monorepo-full",
    "kernel/globus-os",
    "kernel/kai-os",
    "tooling/atc-engineering",
    "apps/atc-node",
    "apps/atc-mining",
    "apps/atc-storage",
    "apps/atc-sdk",
    "apps/atc-interop",
]
