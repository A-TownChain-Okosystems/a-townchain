  - {id: ATC-STD-STDDEV-001, title: "ATC Standards Development Standard — Verbindlicher Lebenszyklus für Standards: Erstellung im Hausformat, Review, §9-Freigabe, §30-Einfrierung, Wartung (MINOR/MAJOR), Review-Zyklen, Deprecation und Retirement", version: "1.0.0", status: approved, category: governance-core, authority: "A-TownChain-Okosystems", owner: "Michael (Owner-Entwurf)", normative: true, file: standards/governance-core/ATC-STD-STDDEV-001.md, mandate: "Governance Core FAM-43 via SCR-0025 (Owner-Direktive 08.09. 00:29) — 14 REQ-SD: 10-Schritte-Erstellungsprozess (Reihenfolge zwingend, EFFECTIVE erst nach APPROVED+Registry-Sync), Rollenmodell mit §9-Human-Gate als einziger Freigabe-Instanz, Autor-Agenten entwerfen/nie freigeben, Lifecycle IDEA→RETIRED (vorwärts, Rollback nur SCR+Owner), Hausformat-Pflicht (DESC-001/MD-001, ALL COMPLIANT als EFFECTIVE-Voraussetzung), Sammelfreigaben zulässig, PATCH/MINOR via SCR/MAJOR via UPDATE-001+COMPAT-001, 365-Tage-Review-Zyklus (Überfälligkeit=P3-Finding), Deprecation/Retirement mit Nachfolger, KI-Autoren unter AOS-001/TAXONOMY-001; kodifiziert die Praxis SCR-0001..0025; SCR-0025; §9-Freigabe 08.09. 00:36, APPROVED, normativ, §30-eingefroren"}
  - {id: ATC-STD-REGISTRY-001, title: "ATC Registry Management Standard — Verbindliche SSOT-Verwaltung aller ATC-Registries: Inventar mit Zuständigkeiten, Single-Source-of-Truth-Prinzip, Generatoren statt Handarbeit, Cross-Registry-Konsistenz über Validator-Gates, Prozess für neue Registries, Manipulationsschutz", version: "1.1.0", status: approved, category: governance-core, authority: "A-TownChain-Okosystems", owner: "Michael (Owner-Entwurf)", normative: true, file: standards/governance-core/ATC-STD-REGISTRY-001.md, mandate: "Governance Core FAM-43 via SCR-0025 — 9 REQ-RM: SSOT-Inventar (standards/versions/dependencies/categories/taxonomy/framework/protocol-registry/repo-audit-checks/findings/milestones + Naming-Schema, je mit Generator/Gate-Tabelle), SSOT-Prinzip (keine Doppel-SSOT, keine Parallelstrukturen, AUD-Typ-Lehre aus ATC-STD-999), Generator-Pflicht bei generierten Registries (Hand-Edit verboten), 5 Konsistenz-Gates je CI-Lauf (S-20..S-24, Manifest-Gate; FAIL blockiert Freigabe), 7-Schritte-Prozess für neue Registries (Generator+Gate+Inventar Pflicht), Maschinenlesbarkeit (YAML/JSON, UTF-8, keine Secrets), SCR-only-Änderungen (Hand-Edits=P1-Finding, kein Status-Vorgriff vor §9), RETIRE mit Migration; SCR-0025; §9-Freigabe 08.09. 00:36, APPROVED, normativ, §30-eingefroren"}
  - {id: ATC-STD-CHANGE-001, title: "ATC Change Control Dachnorm — Eine Änderung, ein Kanal, eine Gate-Landkarte: konsolidierte Zuordnung von ATC-STD-000 §19–33 (SCR), VERSION-001, UPDATE-001 und COMPAT-001 zur verbindlichen Entscheidungsmatrix mit RACI, Notfallpfad und den 13 Change-Nachweis-Fragen als Prüfraster", version: "1.1.0", status: approved, category: governance-core, authority: "A-TownChain-Okosystems", owner: "Michael (Owner-Entwurf)", normative: true, file: standards/governance-core/ATC-STD-CHANGE-001.md, mandate: "Governance Core FAM-43 via SCR-0025 — 11 REQ-CH: Änderungsarten-Matrix (6 Artefakttypen × PATCH/MINOR/MAJOR, im Zweifel strenger), eine Pipeline SCR→VERSION→UPDATE→COMPAT→AUDIT→REGISTRY ohne track-freien Weg, Commit-Trailer-Pflicht, Lifecycle-Konsistenz (EFFECTIVE erst nach Sync), Gate-Landkarte (UPD-G01..G09, RR-G01..G08, S-01..S-24+Manifest, TAX-CHECK, Milestone-Gates, MAUD-PASS bei Ecosystem-MAJOR; verletzte Gates stoppen Pipeline), RACI (Owner immer Accountable, Agenten nur Responsible), Emergency mit 48h-Nachholpflicht (suspendiert keine Gates), lex specialis + Lückenregel, 13 Change-Nachweis-Fragen je Änderung (Lücken=Findings); Dachnorm ordnet zu, ersetzt keine Fachnorm; SCR-0025; §9-Freigabe 08.09. 00:36, APPROVED, normativ, §30-eingefroren"}
