maintenance_requirements:
  standard: ATC-STD-MAINT-000 §6
  version: 1.0.0
  generated_note: GENERIERT aus standards/maintenance/ + registry/standards.yaml — nicht manuell pflegen (SCR-0120
    v7)
  req_count: 15
  verification_types:
  - evidence
  - gate
  - ci
  - audit
  requirements:
  - id: REQ-MAINT-001
    statement: 'A system MUST define its required Maintenance Capability before entering a lifecycle state that
      requires supported operation.

      '
    priority: P0
    verification:
      type: evidence
      required:
      - maintenance_capability
      - lifecycle_status
      - release_record
  - id: REQ-MAINT-002
    statement: 'Maintenance Readiness MUST be a release gate: a release to a state requiring operational support
      MUST pass the Maintenance Readiness Gate; a failed mandatory check MUST block release.

      '
    priority: P0
    verification:
      type: gate
      required:
      - maintenance_readiness
      - gate_result
      - release_record
  - id: REQ-MAINT-003
    statement: 'Every maintenance activity MUST use the M0–M3 classification (Routine, Operational, Security, Critical).

      '
    priority: P0
    verification:
      type: evidence
      required:
      - maintenance_record
      - classification
  - id: REQ-MAINT-004
    statement: 'Controlled maintenance MUST produce evidence establishing what changed, why, who performed it, and
      whether the resulting state was validated; completion MUST NOT be declared from implementation claims alone.

      '
    priority: P0
    verification:
      type: evidence
      required:
      - maintenance_record
      - validation_results
  - id: REQ-MAINT-005
    statement: 'Mandatory maintenance gates MUST fail closed: missing evidence, validation, approval, or safety
      information MUST block the affected release or operation.

      '
    priority: P0
    verification:
      type: ci
      required:
      - conformance_gate_result
      - blocked_on_missing_evidence
  - id: REQ-MAINT-006
    statement: 'M2 and M3 maintenance MUST enforce Separation of Duties (Implementer != Validator != Auditor); critical
      release operations MUST separate Release Authority from Implementer; exceptions MUST be explicitly authorized
      and evidenced.

      '
    priority: P0
    verification:
      type: audit
      required:
      - role_assignment
      - approval_record
  - id: REQ-MAINT-007
    statement: 'Production systems MUST define a rollback or recovery capability appropriate to their architecture;
      an unvalidated rollback strategy MUST NOT be represented as tested.

      '
    priority: P0
    verification:
      type: evidence
      required:
      - rollback_strategy
      - recovery_plan
  - id: REQ-MAINT-008
    statement: 'Production systems MUST define a compatibility strategy; intentional compatibility breaks MUST be
      identified, documented, consumer-checked, validated, and rollback-evaluated.

      '
    priority: P0
    verification:
      type: evidence
      required:
      - compatibility_declaration
  - id: REQ-MAINT-009
    statement: 'Maintenance automation MUST operate within explicit authorization boundaries, MUST NOT bypass mandatory
      governance gates, and an AI agent MUST NOT independently authorize actions requiring human approval.

      '
    priority: P0
    verification:
      type: audit
      required:
      - automation_scope
      - authorization_record
  - id: REQ-MAINT-010
    statement: 'Compliance MUST be evidence-based; a system MUST NOT be declared compliant solely from documentation
      claims.

      '
    priority: P0
    verification:
      type: audit
      required:
      - compliance_report
      - evidence_bundle
  - id: REQ-MAINT-011
    statement: 'Maintenance records MUST be machine-readable and schema-conformant.

      '
    priority: P1
    verification:
      type: ci
      required:
      - maintenance_record_schema_valid
  - id: REQ-MAINT-012
    statement: 'Maintenance conformance SHOULD be CI-enforced with automated conformance checks; a mandatory conformance
      failure MUST block the applicable gate.

      '
    priority: P1
    verification:
      type: ci
      required:
      - conformance_workflow
      - conformance_result
  - id: REQ-MAINT-013
    statement: 'Maintenance metrics SHOULD be collected (MTTD, MTTA, MTTR, MTBF, patch latency, rollback success
      rate, evidence completeness, recovery readiness).

      '
    priority: P1
    verification:
      type: evidence
      required:
      - metrics_report
  - id: REQ-MAINT-014
    statement: 'Maintenance crossing architectural boundaries MUST assess interface and compatibility impact; layered-system
      maintenance (e.g. ATC-VM) MUST NOT be treated as an isolated package update.

      '
    priority: P0
    verification:
      type: evidence
      required:
      - impact_assessment
  - id: REQ-MAINT-015
    statement: 'M3 (critical) maintenance MUST use the Emergency Maintenance process and MUST NOT eliminate evidence,
      validation, or post-event accountability.

      '
    priority: P0
    verification:
      type: audit
      required:
      - incident_record
      - emergency_review
