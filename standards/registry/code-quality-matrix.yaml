# ATC Code Quality Matrix — SSOT (ATC-STD-ENG-001 REQ-ENG-011)
# Eintrag je Repository: Sprache, Layer, Determinismus-Klasse, Dependency-Budget,
# Test-Anforderungen, CI-Gates. Automatisiert zu erheben: tools/code_quality_matrix.py
# Abweichungen erzeugen Findings (ATC-STD-BUG-001). Owner-Entwurf 11.09.2026.

schema_version: "1.0"
standard_ref: ATC-STD-ENG-001
generated: "2026-09-11"

determinism_classes:
  D-CRITICAL: "Konsens-/VM-/Krypto-/Kernel-Code — Determinismus MUST-STRICT (REQ-ENG-002)"
  D-HIGH:     "State-beeinflussende Peripherie (Storage, Indexer, Interop)"
  D-STANDARD: "UI, AI-Interpretation, Docs — keine Konsens-Relevanz"

dependency_budgets:
  B-ZERO:       "keine externen Abhängigkeiten"
  B-MINIMAL:    "< 5, alle kryptografisch geprüft"
  B-CONTROLLED: "< 15, version-locked, auditierbar"
  B-LIBERAL:    "UI-Ebene, frei"

repositories:
