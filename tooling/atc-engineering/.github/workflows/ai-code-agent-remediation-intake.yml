name: ai-code-agent-remediation-intake

on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ai_agent_ci_triage.py"
      - "tests/test_ai_agent_ci_triage.py"
      - ".github/workflows/ai-code-agent-remediation-intake.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-code-agent-remediation-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-triage:
    name: Test triage logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
      - name: Run deterministic unit tests
        run: python3 -m unittest discover -s tests -p 'test_ai_agent_ci_triage.py' -v
      - name: Compile triage code
        run: python3 -m py_compile scripts/ai_agent_ci_triage.py tests/test_ai_agent_ci_triage.py

  triage:
    name: Collect non-passing CI evidence
    if: github.event_name != 'pull_request'
    needs: test-triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
      - name: Collect workflow, job, and step evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/ai_agent_ci_triage.py
      - name: Publish triage summary
        if: always()
        run: |
          if test -f artifacts/ai-agent-triage/summary.md; then
            cat artifacts/ai-agent-triage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BLOCKED: triage report missing; no PASS inferred." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload machine-readable triage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-ci-triage-${{ github.run_id }}
          path: artifacts/ai-agent-triage/
          if-no-files-found: error
          retention-days: 90
