name: Catalog Exclusion Evidence Audit

on:
  pull_request:
    paths:
      - "scripts/org_function_catalog.py"
      - "scripts/validate_catalog_exclusions.py"
      - "tests/test_catalog_exclusion_audit.py"
      - ".github/workflows/catalog-exclusion-evidence-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exclusion-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install authoritative parser dependencies
        run: python -m pip install --disable-pip-version-check 'tree-sitter>=0.25,<0.26' 'tree-sitter-rust>=0.24,<0.25' 'tree-sitter-bash>=0.23,<0.24' 'markdown-it-py>=3,<5' 'PyYAML>=6,<7'

      - name: Generate source-bound inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reconciliation-artifacts
          ATC_CATALOG_SOURCE_SHA="${GITHUB_SHA}" python scripts/org_function_catalog.py . \
            --repository "${GITHUB_REPOSITORY}" \
            --output reconciliation-artifacts/inventory.json

      - name: Audit exclusion evidence bindings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_catalog_exclusions.py \
            reconciliation-artifacts/inventory.json \
            --output reconciliation-artifacts/exclusion-audit.json

      - name: Run exclusion audit regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_catalog_exclusion_audit.py'

      - name: Upload inventory and exclusion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-exclusion-evidence-audit
          path: reconciliation-artifacts/
          if-no-files-found: error
