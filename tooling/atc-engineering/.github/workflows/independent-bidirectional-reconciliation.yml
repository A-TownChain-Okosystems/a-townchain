name: Independent Bidirectional Reconciliation Gate

on:
  pull_request:
    paths:
      - "scripts/validate_bidirectional_reconciliation.py"
      - "scripts/reconciliation_status_contract.py"
      - "tests/test_reconciliation_status_contract.py"
      - "docs/architecture/reconciliation-status-contract.v1.json"
      - "docs/architecture/reconciliation-status-contract.md"
      - "schemas/reconciliation-verification-claim.schema.json"
      - "docs/architecture/reconciliation-status-consumer-audit.v1.json"
      - "docs/architecture/reconciliation-status-consumer-discovery.v1.json"
      - "tests/test_bidirectional_reconciliation.py"
      - ".github/workflows/independent-bidirectional-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Validate status consumer discovery artifact
        run: python -m json.tool docs/architecture/reconciliation-status-consumer-discovery.v1.json > /dev/null
      - name: Run independent reconciliation regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_bidirectional_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_reconciliation_status_contract.py' -v
