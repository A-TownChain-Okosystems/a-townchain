name: Fleet Audit

# FLEET_GATE_POLICY v1.0.0 (AD-051): Fleet = Main/Schedule-Health-Gate, kein PR-Gate
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

# Read-only by design. Private repositories require ATC_FLEET_READ_TOKEN.
permissions:
  contents: read

jobs:
  engineering:
    name: Engineering self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

  fleet:
    name: Audit complete repository fleet
    runs-on: ubuntu-latest
    needs: engineering
    steps:
      - name: Checkout engineering platform
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build audit CLI
        run: cargo build --release -p atc-audit-cli

      - name: Discover organization repositories
        id: repos
        env:
          GH_TOKEN: ${{ secrets.ATC_FLEET_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh repo list A-TownChain-Okosystems --limit 100 --json name,isPrivate \
            --jq '.[] | [.name, (.isPrivate|tostring)] | @tsv' > /tmp/repos.tsv
          test -s /tmp/repos.tsv
          echo "Discovered $(wc -l < /tmp/repos.tsv) repositories."

      - name: Audit, syntax-check and test repositories
        env:
          GH_TOKEN: ${{ secrets.ATC_FLEET_READ_TOKEN || github.token }}
        run: |
          set -uo pipefail
          mkdir -p audit-results
          failed=0
          : > audit-results/SUMMARY.md
          printf '# Fleet Audit Summary\n\n' >> audit-results/SUMMARY.md

          while IFS=$'\t' read -r repo private; do
            echo "=== $repo (private=$private) ==="
            rm -rf "/tmp/$repo"
            if ! gh repo clone "A-TownChain-Okosystems/$repo" "/tmp/$repo" -- --depth 1; then
              {
                printf 'Repository: %s\n' "$repo"
                printf 'Audited commit SHA: null\n'
                printf 'Clone status: FAILED\n'
                printf 'Fleet audit run ID: %s\n' "$GITHUB_RUN_ID"
                printf 'Fleet audit workflow SHA: %s\n\n' "$GITHUB_SHA"
                printf 'CLONE ERROR: %s\n' "$repo"
              } | tee "audit-results/$repo.txt"
              printf -- '- **BLOCKED:** `%s` — clone failed; no audited commit SHA available; private repositories require `ATC_FLEET_READ_TOKEN`.\n' "$repo" >> audit-results/SUMMARY.md
              failed=1
              continue
            fi

            audited_sha="$(git -C "/tmp/$repo" rev-parse --verify HEAD)"
            audited_subject="$(git -C "/tmp/$repo" log -1 --format=%s)"
            result="audit-results/$repo.txt"
            : > "$result"
            {
              printf 'Repository: %s\n' "$repo"
              printf 'Audited commit SHA: %s\n' "$audited_sha"
              printf 'Audited commit subject: %s\n' "$audited_subject"
              printf 'Fleet audit run ID: %s\n' "$GITHUB_RUN_ID"
              printf 'Fleet audit workflow SHA: %s\n\n' "$GITHUB_SHA"
            } >> "$result"
            repo_failed=0

            if ! ./target/release/atc-audit-cli "/tmp/$repo" >> "$result" 2>&1; then
              repo_failed=1
            fi

            {
              echo
              echo '## Native verification'
              cd "/tmp/$repo"

              if find . -name Cargo.toml -not -path '*/target/*' -print -quit | grep -q .; then
                echo '### Rust: cargo check/test'
                while IFS= read -r manifest; do
                  echo "-- manifest: $manifest"
                  if ! timeout 10m cargo check --manifest-path "$manifest" --all-targets; then repo_failed=1; fi
                  if ! timeout 10m cargo test --manifest-path "$manifest"; then repo_failed=1; fi
                done < <(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/archive/*' -print | sort -u)
              fi

              if find . -name package.json -not -path '*/node_modules/*' -print -quit | grep -q .; then
                echo '### Node: package validation'
                while IFS= read -r package; do
                  dir="$(dirname "$package")"
                  echo "-- package: $package"
                  if [ -f "$dir/package-lock.json" ]; then
                    if ! timeout 10m npm ci --ignore-scripts --prefix "$dir"; then repo_failed=1; fi
                  fi
                  if ! timeout 10m npm run test --if-present --prefix "$dir"; then repo_failed=1; fi
                done < <(find . -name package.json -not -path '*/node_modules/*' -not -path '*/archive/*' -print | sort -u)
              fi

              if find . -name '*.py' -not -path '*/.venv/*' -not -path '*/archive/*' -print -quit | grep -q .; then
                echo '### Python: syntax validation'
                if ! timeout 10m python -m compileall -q . -x '(^|/)(\.git|\.venv|node_modules|archive)(/|$)'; then repo_failed=1; fi
              fi

              if find . -name '*.sh' -not -path '*/archive/*' -print -quit | grep -q .; then
                echo '### Shell: syntax validation'
                while IFS= read -r script; do
                  if ! bash -n "$script"; then repo_failed=1; fi
                done < <(find . -name '*.sh' -not -path '*/archive/*' -print | sort -u)
              fi
            } >> "$result" 2>&1

            cd "$GITHUB_WORKSPACE"
            cat "$result"

            if [ "$repo_failed" -eq 0 ] && grep -q '^AUDIT PASS:' "$result"; then
              printf -- '- **PASS:** `%s` — audit + native verification passed; audited SHA: `%s`.\n' "$repo" "$audited_sha" >> audit-results/SUMMARY.md
            else
              printf -- '- **FINDINGS:** `%s` — audit and/or native verification requires remediation/evidence; audited SHA: `%s`.\n' "$repo" "$audited_sha" >> audit-results/SUMMARY.md
              failed=1
            fi
          done < /tmp/repos.tsv

          cat audit-results/SUMMARY.md
          exit "$failed"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-audit-results
          path: audit-results/
          retention-days: 30
