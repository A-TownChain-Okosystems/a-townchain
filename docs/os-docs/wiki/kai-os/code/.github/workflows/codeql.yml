# CodeQL-Analyse (Advanced Setup) fuer kai-os.
# Sprachen werden aus der Matrix unten bestimmt: javascript-typescript und python,
# beide mit build-mode "none" (keine Kompilierung noetig).
name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
        # CodeQL unterstuetzt fuer "language": actions, c-cpp, csharp, go,
        # java-kotlin, javascript-typescript, python, ruby, rust, swift.
        # Fuer kompilierte Sprachen build-mode auf "manual" setzen und den
        # Build-Schritt unten ausfuellen.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialisiert die CodeQL-Werkzeuge.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Eigene Abfragen lassen sich hier oder per Config-Datei setzen;
          # ein "+"-Praefix ergaenzt die Standardpakete statt sie zu ersetzen.
          # queries: security-extended,security-and-quality

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'Manueller Build-Modus: hier die Build-Befehle eintragen.'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
