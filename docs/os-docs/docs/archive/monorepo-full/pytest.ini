# A-TownChain OS — pytest Configuration (K7 Konsolidierung)
# Agent: Aurora #2 (6a275618)

[pytest]
testpaths = tests/unit tests/integration tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov=modules
    --cov-report=term-missing
    --cov-report=html:tests/coverage_html
    --cov-report=xml:tests/coverage.xml
    --cov-fail-under=80
    --timeout=30
markers =
    unit: Unit tests
    integration: Integration tests (need multiple services)
    e2e: End-to-end tests (need full stack)
    slow: Tests that take >5s
    skip_atc: Module migrated to ATCLang (.atc)
