[package]
name = "atc-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Michael Wroblewski / ShivaCore / A-TownChain-Okosystems"]
license = "All Rights Reserved"
description = "ATC Kernel abstraction layer (ATS-1000-ATS-1007)"
