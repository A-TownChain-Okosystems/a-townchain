[package]
name = "shivacore"
version = "0.0.1"
edition = "2021"
description = "ShivaCore Kernel — implementiert ATS-1000, eigener Kernel ohne Linux-Unterbau"

[[bin]]
name = "shivacore"
test = false
bench = false
required-features = ["x86-boot"]

[lib]
name = "shivacore"
path = "src/lib.rs"
test = true
bench = false
crate-type = ["lib"]

[features]
# x86-boot: echtes Boot-Binary (main.rs, physisches Paging, UART) — benoetigt NIGHTLY.
# Ohne dieses Feature kompiliert die Kernel-Lib Stable-kompatibel (Tests, Validator-Logik).
default = []
x86-boot = ["dep:bootloader_api", "dep:x86_64", "dep:uart_16550", "dep:pic8259", "dep:pc-keyboard", "dep:volatile", "dep:noto-sans-mono-bitmap"]

[dependencies]
bootloader_api = { version = "0.11", optional = true }
volatile = { version = "0.2.6", optional = true }
spin = "0.9"
x86_64 = { version = "0.15", optional = true }
uart_16550 = { version = "0.3", optional = true }
pic8259 = { version = "0.11", optional = true }
pc-keyboard = { version = "0.7", optional = true }
lazy_static = { version = "1.5", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
noto-sans-mono-bitmap = { version = "0.2", default-features = false, features = ["regular", "size_16"], optional = true }
rand = { version = "0.8", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }
libm = "0.2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"