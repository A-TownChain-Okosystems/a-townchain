zusatzanforderungen:
  - id: SCE-Z1
    title: "VM-Versionierung"
    rule: "Ein Validator darf nicht unbemerkt eine andere Ausfuehrungssemantik verwenden."
    mapped_to: [REQ-SCE-042, SCX-004, SCX-009]
  - id: SCE-Z2
    title: "State-Rollback"
    rule: "Jede fehlgeschlagene Ausfuehrung rollt ihren Vertragszustand vollstaendig zurueck."
    mapped_to: [REQ-SCE-043, SCX-008]
  - id: SCE-Z3
    title: "Replay-Sicherheit"
    rule: "Dieselbe Transaktion darf durch erneute Verarbeitung keine doppelten Zustandsaenderungen verursachen."
    mapped_to: [REQ-SCE-044, SCX-006, SCX-009]

