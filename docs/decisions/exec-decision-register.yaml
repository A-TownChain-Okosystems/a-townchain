  - id: D4
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.6, §5.10 (nicht ratifiziert)"
    title: "Gas: eine Tabelle, Transaktionsbudget, Gebuehrenabbuchung"
    decision_status: DECIDED
    decision: BEDINGT_FREIGEGEBEN
    specification_status: OPEN
    implementation_status: OPEN
    gate: SCE-G6
    conditions:
      - "Trennung gas_limit, gas_used, gas_price, fee_charged, gas_refund"
      - "Gebuehrenabrechnung unabhaengig vom Rollback des Vertragszustands"
      - "fehlgeschlagener Vertrag verbraucht Rechenzeit nicht kostenlos"
      - "Gebuehren und Verbrauch im Transaktionsbeleg"
      - "keine Gebuehrenumgehung ueber Backend oder Loader"
      - "Fehlerklassen getrennt: Erschoepfung volles Budget, Revert nur verbrauchtes Gas, Ablehnung ohne Ausfuehrung ohne Gas (REQ-SCE-047, 054)"
      - "gas_refund in Gaseinheiten, Geldbetrag getrennt benannt (REQ-SCE-055)"
      - "Erstattungsregel normativ festlegen und mit T-28 belegen; Formeln bisher ausdruecklicher Vorschlag"
      - "Grundsatz ratifiziert 12.11.2026 (S1-3 Option A): ausschliesslich Gasrueckgabe, gas_refund in Gaseinheiten, kein Geldbetrag; ungenutztes Budget verfaellt, ausdruecklich auch nach Einfuehrung einer tatsaechlichen Kontobelastung"
      - "Vierte Fehlerklasse: interner Infrastrukturfehler ohne Nutzerbelastung, deterministisch, eigener Statuscode (REQ-SCE-060)"
      - "Zwei getrennte Code-Raeume: Beleg-Status 0x00 bis 0x03, Knotenfehler ATC-NODE-INFRA-001 nie im Beleg (REQ-SCE-054)"
      - "Wiederaufnahme: derselbe Block nach behobenem Fehler deterministisch identisch (REQ-SCE-060 Punkt 4)"
