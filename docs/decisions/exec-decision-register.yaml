# Entscheidungsregister Smart-Contract-Ausfuehrung
# SSOT fuer D1 bis D7. Die Tabellen in
#   docs/decisions/AD-EXEC-D1-D7.md
#   standards/atc/candidates/ATC-SMART-CONTRACT-EXECUTION-001-CANDIDATE.md
# werden aus dieser Datei erzeugt (tools/decision_register.py).
# Aenderungen nur hier; dann `python3 tools/decision_register.py --write`.

register: ATC-EXEC-DECISIONS
version: 1
owner: Michael Wroblewski
decided_on: 2026-11-12
source: "Owner-Bewertung P1 (Chat, 12.11.2026)"
ladder:
  - DECIDED       # Architekturentscheidung getroffen
  - SPECIFIED     # vollstaendig normativ spezifiziert (Kandidat bzw. Standard)
  - IMPLEMENTED   # Umsetzung im bestehenden System nachgewiesen
rules:
  - "Kein Zustand ersetzt den naechsten automatisch."
  - "Die Gates bleiben bis zum jeweiligen Nachweis offen."
pending_globally:
  - "Numerische Gaspreise (Messung je Instruktionsklasse und Vertragsbenchmark)"
  - "Endgueltiges Transaktionsgaslimit"
  - "Endgueltiges Blockgaslimit"
  - "Implementierungs- und CI-Gates"
  - "Konflikt Aufruftiefe: Owner-Entscheidung 64 vom 09.11.2026 in ATC-BC-002 (Kandidat, nicht ratifiziert) gegen SCE-Vorschlag 8 (R-901)"
  - "Fehlende CALL-Instruktion und Identitaetstyp auf dem u64-Stapel (R-902, R-907)"
  - "Autoritaet der beiden Instruktionssaetze (R-906)"
  - "Governance-Luecke: ATC-SEC-EXEC-001, ATC-BC-001 und ATC-BC-002 sind keine Eintraege in atc-standards/registry/standards.yaml; D0 ist damit intern verbindlich, aber nicht gegen einen registrierten Standard durchsetzbar"
  - "ATC-STD-410: Reservierung ist Registry-Zeile (atc-standards Branch reserve/atc-std-410, PR offen wegen unverifizierter E-Mail); normative Freigabe (Technical/Security/Architecture Review + Owner-Approval) fehlt"
  - "ATC-STD-410: Familienverkabelung entschieden (Option B, FAM-77) und umgesetzt auf atc-standards Branch std/family-400-option-b; Merge offen (PR-Anlage an unverifizierter E-Mail gesperrt). Gate Familie 400 lokal PASS (52/52, 51 Ausnahmen)"
  - "S1-2/F-1: Policy-Ueberschreibung in der Registry; Regel, neuer Code ADM-012 und Verbleib von source_provenance in der signierten Policy sind offen (EXEC-S1-2-ADMISSION-REGISTRY-F1.md)"
  - "P1b/P1c/P1d-A: IMPLEMENTED/TESTED. P1d-B: G-01 Build-Abdeckung als Gate (77 Manifeste klassifiziert, 7 ohne Build-Nachweis, CI-Verankerung BLOCKED/Owner). P1d-B1: Inventur der Eigentums- und Commit-Verhaeltnisse abgeschlossen (docs/decisions/EXEC-P1D-B1-OWNERSHIP-INVENTORY-2026-11-12.md) — KEIN Umbau; Befunde: kein Zustandsspeicher, deploy schreibt Registry ohne Block, DevnetNode fuehrt neben System eine zweite Kette, keine Konkurrenzkontrolle. Neu geordnet (B1-Stand): B1 Chain herausloesen, B2 State-Root-Vorbedingung, C atomarer Commit, D Standalone Node, E import_tx_block, F E2E. ABGELOEST durch die Phasenordnung vom 12.11.2026: B1 Inventur (abgeschlossen), B2 Architekturentscheidungen (getroffen, AD-B1-01..04), C Persistenz und atomarer Commit, D Runtime-Komposition, E import_tx_block, F E2E-Sicherheitsaudit. Die vier Freigabepunkte sind damit entschieden (docs/decisions/AD-P1D-B2-FOUR-DECISIONS-2026-11-12.md): autoritativer Bestand = Kompositionswurzel, Zustandsspeicher = append-only Log mit Snapshot als abgeleitetem Beschleuniger, state_root = vollstaendiger konsensrelevanter Zustand, deploy-Registry = Teil des Deployment-Commits. P1d-C ist NICHT freigegeben: erst B2-S1..S5 spezifizieren (Datenmodell, Wurzelkomposition, Log-Format, Recovery, Ausfuehrungsnachweis). Offen bleiben B2-O1 Authority-Pfade ohne Block, B2-O2 64-Block-Grenze gegen dauerhafte Kette, B2-O3 Format des Deployment-Blocks, B2-O4 Speichermedium"

# Stufe-1-Ratifikation vom 12.11.2026 (Owner-Wortlaut im Chat, Basis HEAD a63e41a93).
# Eine Stufe-1-Ratifikation entscheidet die Option, nicht den Standard.
stage1:
  - id: P1A
    title: "Block-Payload transportiert die ATCE-Huelle, Import prueft an der Systemgrenze"
    option: "A (Transportform atce:<hex>, Pruefung in atc-system, keine ATCB-Route)"
    ratified_at: "2026-11-12"
    basis_head: "5dae394b (vor diesem Paket)"
    effect: "Block-Payload kann die Huelle transportieren; eine ausfuehrbare Payload laeuft durch dieselbe Systemgrenze, ATCB bleibt ohne externe Route"
    state: IMPLEMENTED
    verified_by: "11 Tests in components/system/tests/block_payload_container.rs; Workspace 727 gruen; CI_VERIFIED offen"
    evidence: "docs/decisions/EXEC-P1A-BLOCKPAYLOAD-EVIDENCE-2026-11-12.md"
  - id: S1-1
    title: "Drei getrennte Identitaeten: artifact_hash, code_hash, state_root"
    option: "A mit Domaenenvariante 1b"
    ratified_at: "2026-11-12"
    basis_head: "a63e41a93"
    effect: "zweite Hashidentitaet wird berechnet, nicht nur benannt; neue Containerfassung ist Teil derselben Entscheidung; ATC-STATE-V2 unabhaengig von der Variante"
  - id: S1-2
    title: "Policy-Bindung: welche Identitaet Freigabe, Widerruf, Mindestversion bindet"
    option: "C, asymmetrisch"
    ratified_at: "2026-11-12"
    basis_head: "a63e41a93"
    effect: "Freigabe und Mindestversion am code_hash, Widerruf getrennt fuer Code und Artefakt; getypte Schluesselraeume, zwei Abfragen, nur als vollstaendige Einheit (S1-T-38)"
  - id: S1-3
    title: "Erstattung: Grundsatz"
    option: "A, ausschliesslich Gasrueckgabe"
    ratified_at: "2026-11-12"
    basis_head: "a63e41a93"
    effect: "gas_refund in Gaseinheiten, kein Geldbetrag; ungenutztes Budget verfaellt, auch nach Einfuehrung einer Kontobelastung"
  - id: S1-4
    title: "Testschichtung L1/L2/L3"
    option: "B, nur L1 zaehlt fuer P1a"
    ratified_at: "2026-11-12"
    basis_head: "a63e41a93"
    effect: "L1 muss nicht ausfuehrbar sein, um zu zaehlen; L2 und L3 bleiben bis B-1 gesperrt; L1 ist heute EMPTY, P1a bleibt offen"

resolved_by_ratification:
  - "B-2 Artefaktidentitaet im Identitaetsteil (R-903); Container-Magic am 12.11.2026 entschieden: ATCE fuer die Huelle"
  - "B-3 Verfahren (R-905): Schichtung entschieden, L2 und L3 bleiben bis B-1 gesperrt"

decisions:
  - id: D-0
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §18.1-18.3, §19.1-19.5 und §19.2a (nicht ratifiziert); Korpus standards/atc/conformance/stage1-parser-corpus.json"
    title: "Zwei getrennte Formate: Huelle ATCE/0x02 aussen, Bytecode ATCB/0x01 innen"
    decision_status: DECIDED
    decision: FREIGEGEBEN
    specification_status: SPECIFIED
    implementation_status: OPEN
    gate: SCE-G1
    conditions:
      - "ATCE/0x02 kapselt das Artefakt; ATCB/0x01 bleibt das ausfuehrbare Bytecodeformat"
      - "Die Huelle veraendert weder Opcodes noch Bytecode-Semantik; der Bytecode-Hash bleibt unveraendert"
      - "Kein Parser akzeptiert das Magic des anderen; keine unkontrollierte Vermischung der Formate"
      - "Digest der Huelle erst nach erfolgreicher Strukturpruefung, Laengen und Stromgrenzen strikt"
      - "Keine doppelte Implementierung von VM-Logik: Opcode-Tabelle und Stromprozedur sind gemeinsam"
      - "Kandidat und Korpus bleiben maszgeblich; keine nachtraegliche Umschreibung auf ATCB/0x01"
      - "Die vier Architekturfragen sind am 12.11.2026 je mit Option A entschieden (D0-1 bis D0-4, AD-EXEC-D0-FOUR-DECISIONS-2026-11-12.md); die Invarianten I1 bis I9 gelten fuer jede weitere Aenderung"
    sub_gates:
      - id: D0-1
        title: "Containergrenze: ATCE ist der verbindliche externe Eingang"
        owner: "Format/System"
        goal: "Jedes externe ausfuehrbare Artefakt laeuft ueber ATCE; Blockimport und Systemeingang verwenden denselben Vertrag, kein zweiter Eingangsweg"
        status: DECIDED
        open_because: "Umsetzung P1a offen: Block.payload und Importpfad transportieren heute keinen Container (AD-EXEC-D0-FOUR-DECISIONS-2026-11-12.md)"
      - id: D0-2
        title: "Interne Grenze: ATCB bleibt internes Artefaktformat"
        owner: "VM-Kern"
        goal: "Eine Bytecodeform, eine Opcode-Tabelle, eine Strompruefung; ATCB ist von aussen nicht erreichbar, into_artifact ist der einzige Uebergang"
        status: DECIDED
        open_because: "im Systemeingang umgesetzt (d5b25f3b); vollstaendig erst mit P1a, weil der Import noch offen ist"
      - id: D0-3
        title: "Authentizitaet: Signatur als eigene Ebene ueber artifact_hash"
        owner: "Sicherheit/Signatur"
        goal: "Signaturpruefung, Schluesselidentitaet, Widerruf und Vertrauensrichtlinien getrennt spezifiziert; Digest allein gilt nie als Herkunftsnachweis"
        status: DECIDED
        open_because: "Umsetzung nicht freigegeben: Bedrohungsmodell und Schluesselrichtlinie fehlen"
      - id: D0-4
        title: "Versionierung: eigener Parser je Containerfassung"
        owner: "Format/Versionierung"
        goal: "Keine automatische Konvertierung, keine stillschweigende Deutung unbekannter Fassungen, Opcode-Aenderungen nur als Generation, Bytecode-Hash bleibt stabil"
        status: DECIDED
        open_because: "geltende Fassung 0x02 umgesetzt; Verfahren fuer die naechste Fassung dokumentiert, aber nicht erprobt"
    open_items:
      - "ATCE/0x02: Schicht (components/vm/src/envelope.rs, Commit a0ea77f3, Blob b253ffc3) und Systemeingang (components/system/src/system.rs, Commit d5b25f3b, Blob 14436437) umgesetzt und lokal geprueft; Status OPEN, weil die vier Architekturfragen (Containergrenze, interne Grenze, Authentizitaet, Versionierung) und ein CI-Lauf fehlen (EXEC-D0-ARCH-QUESTIONS-TEMPLATE-2026-11-12.md, EXEC-D0A-SYSTEM-INGRESS-EVIDENCE-2026-11-12.md)"
      - "Befund F-1: die Registry fuehrt eine Freigabe je code_hash; Quell- und Huellenweg erzeugen fuer dasselbe Programm verschiedene Policies (source_provenance) und ueberschreiben sich (ADM-009). Kein Sicherheitsverlust, aber eine zweite Aussage ueber denselben code_hash; Aenderung waere eine eigene Aufgabe an atc_exec_admission"
      - "Verbleibende Luecke zu F-1: Block.payload und Importpfad transportieren keinen Container; die Sicherheitsgrenze ist bisher nur im Deploy-Weg durchgesetzt"
      - "Differentialtest: lokaler Lauf 40 von 40 Eingaben gleich (Huelle gegen den unabhaengigen Referenzdekoder); Status bleibt BLOCKED bis zur vollstaendigen Integration und unabhaengigen Pruefung (Owner 12.11.2026); Nachweis EXEC-D0-ATCE-ENVELOPE-EVIDENCE-2026-11-12.md"
      - "CI_VERIFIED nicht vergeben; kein CI-Lauf am exakten HEAD"

  - id: S1-2-F1
    ratification: "nicht ratifiziert (ATC-STD-410 = reserviert 12.11.2026; Kandidat 0.1.1-draft)"
    specified_in: "ATC-STD-410 Kandidat Abschnitt 4a (Registrierung; Vorgaengerkennung ATC-SEC-EXEC-001) und standards/atc/conformance/admission-codes.json"
    title: "Admission Registry: Registrierung ist Compare-and-Insert, kein Last-Write-Wins (F-1)"
    decision_status: DECIDED
    decision: FREIGEGEBEN
    specification_status: SPECIFIED
    implementation_status: IMPLEMENTED
    verified_by: "Owner-Bewertung 12.11.2026: IMPLEMENTED + TESTED (T-01..T-08 gruen); CI_VERIFIED nicht vergeben"
    gate: SCE-G5
    conditions:
      - "Die Registry fuehrt genau eine Policy je code_hash; die vorhandene Architektur bleibt (BTreeMap je code_hash, keine zweite Registry)"
      - "Registrierung ist Compare-and-Insert: unbekannt einfuegen, bytegleich idempotent, abweichend PolicyConflict ohne jede Aenderung"
      - "Verglichen werden die vollstaendigen kanonischen Policy-Bytes, nicht einzelne Felder"
      - "Kein Last-Write-Wins, keine implizite Aktualisierung, kein stiller Ersatz; die zuerst registrierte Policy bleibt"
      - "Konflikte tragen eine reproduzierbare Identitaet (Code, code_hash, beide Bytefolgen) ohne Zeitstempel und ohne Zufall"
      - "Die Registrierungsreihenfolge muss konsensgeordnet sein (bestaetigte Deployment-Reihenfolge); lokale Ankunftsreihenfolge darf keine Konsensentscheidung veraendern"
      - "source_provenance bleibt Bestandteil der signierten Policy; Option C (Herkunftsnachweis aus der Signatur herausnehmen) ist NICHT freigegeben"
      - "ADM-009 beschreibt nur noch die Anfrage-Abweichung von der registrierten Policy, nicht den Registrierungskonflikt"
    sub_gates:
      - id: S1-2-D1
        title: "Policy-Konflikt: Option A, Erstregistrierung gewinnt"
        owner: "Admission-Layer"
        goal: "Compare-and-Insert mit idempotenter Wiederholung und deterministischer Ablehnung abweichender Policies; keine Zustandsaenderung bei Konflikt"
        status: IMPLEMENTED
        open_because: "umgesetzt in components/exec-admission/src/lib.rs (Registry::register, RegistryError) und geprueft durch S1-2-T-01/02/04/07/08; CI_VERIFIED offen"
      - id: S1-2-D2
        title: "ADM-012 POLICY_CONFLICT als eigener Fehlercode"
        owner: "Governance/Spezifikation"
        goal: "Der Konflikt erhaelt eine eigene Fehleridentitaet, ohne ADM-009 umzudeuten; die Codeliste ist an einer Stelle maschinenlesbar registriert"
        status: OPEN
        open_because: "ATC-STD-410 ist seit 12.11.2026 reserviert (nicht normativ); Kandidat 0.1.1-draft und admission-codes.json fuehren ADM-012 als proposed, der Systempfad meldet code=None statt einer provisorischen Kennung. Freigabe braucht Technical/Security/Architecture Review und Owner-Approval"
      - id: S1-2-D3
        title: "source_provenance bleibt Teil der signierten Policy"
        owner: "Format/Sicherheit"
        goal: "Herkunft bleibt kryptografisch gebunden; gleicher code_hash mit abweichender Herkunft ist ein Policy-Konflikt"
        status: IMPLEMENTED
        open_because: "beibehalten, keine Formatmigration; Option C ist nicht freigegeben"
  - id: D1
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.1, §18.1-18.3, §19.1-19.5 und §19.2a (nicht ratifiziert)"
    title: "Bytecode-Kopf: eigene VM-Huelle, ATC-BC-001 unveraendert"
    decision_status: DECIDED
    decision: FREIGEGEBEN
    specification_status: SPECIFIED
    implementation_status: OPEN
    gate: SCE-G1
    conditions:
      - "eigenes Magic"
      - "eigene Versionskennung"
      - "festgelegte Byte-Reihenfolge"
      - "eindeutige Laengenangabe"
      - "kanonische Serialisierung"
      - "keine Aenderung am bestehenden Transaktionsformat"
      - "SCX-003 und SCE-ARTIFACT verwenden dieselbe Formatdefinition; ATCB ist nicht das Magic des VM-Containers (erfuellt durch ATCE)"
      - "Drei Identitaeten getrennt benannt und verwendet: artifact_hash (Integritaet), code_hash (Instruktionsstrom), state_root (Ausfuehrungscommitment) — ratifiziert 12.11.2026, S1-1 Option A mit Domaenenvariante 1b"
      - "Neue Containerfassung ist Teil von S1-1b, nicht eine spaetere unabhaengige Aenderung"
      - "Beide Hashes tragen feste, byte-exakte Domaenen-Praefixe (S1-T-33, S1-T-34)"
      - "Magic der Huelle: ATCE, Fassung 0x02 (Owner 12.11.2026); ATCB bleibt ausschliesslich der Strom"
      - "Zweiter Dekoder: die VM ist erst nach D1-B und D1-C und nach zwei weiteren Korrekturen konform (ATCB/0x01 nicht mehr annehmen, Struktur vor Integritaet pruefen, S1-T-52)"
      - "Container-Bytegrenze (D1-A) und E-012 sind zwei Mechanismen: die Grenze bewertet die gesamte Eingabe vor dem Hashing, E-012 die dekodierte Stromlaenge (S1-T-55)"
      - "Stromgrenze und Dekodierprozedur sind verbindlich (§19.2a): tail_start = L - 32, E-005 nur an der Instruktionsgrenze, E-002 im Operanden, E-008 nach c Instruktionen (S1-T-49 bis S1-T-51)"
    sub_gates:
      - id: D1-A
        title: "Container-Admission: verbindliche Byteobergrenze vor dem Hashing"
        owner: "Admission-Layer"
        goal: "Die gesamte Eingabe wird gegen eine konsensweit identische Obergrenze geprueft, bevor Hash-, Dekodier- oder Allokationsarbeit anfaellt; der Dekoder bleibt eine reine Funktion ohne eigene Groessenpolitik"
        status: OPEN
        open_because: "Wert offen bis zur Messung in P1b und darf nicht aus bestehenden VM-Grenzen abgeleitet werden (Kandidat §19.7, S1-T-55)"
      - id: D1-B
        title: "Dekoderfehler: EMPTY_STREAM (E-004) und COUNT_MISMATCH (E-005) ergaenzen"
        owner: "VM-Parser"
        goal: "ArtifactError fuehrt alle zwoelf Codes aus §19.1; beide fehlenden Varianten sind vorhanden und tragen dieselbe Bedingung wie der Vertrag"
        status: IMPLEMENTED
        open_because: "Code-Test am Commit 6a164080 (Blob 75e881e4), 684 Tests gruen; CI_VERIFIED offen, keine Konformitaet ohne Korpuslauf (Nachweis EXEC-D1BC-VM-PARSER-EVIDENCE-2026-11-12.md)"
      - id: D1-C
        title: "Groessenpruefung: dekodierte Laenge statt deklarierter Anzahl"
        owner: "VM-Parser / Admission-Vertrag"
        goal: "Die Groessenpruefung bewertet die dekodierte Stromlaenge (p - 10); die deklarierte Anzahl c ist Obergrenze und kein Ausloeser von E-012. C-8-GV1-MAX ergibt E-005, nicht ProgramTooLarge"
        status: IMPLEMENTED
        open_because: "Code-Test am Commit 6a164080: c ist nur Obergrenze, gemessen wird die dekodierte Laenge; E-012 prueft die Protokollkonstante MAX_PROGRAM_OPS, der Betreiberwert bleibt P1b (Nachweis EXEC-D1BC-VM-PARSER-EVIDENCE-2026-11-12.md)"
    open_items:
      - "Groesstwert fuer E-012: kein Wert festgelegt, deshalb kein Korpusfall; haengt an T-21 bis T-24"
      - "Differentialtest offen: ein Referenzdekoder vorhanden (tools/atc_reference_decoder.py), zweiter Dekoder fehlt"
      - "D1-A bis D1-C sind getrennt zu implementieren und zu testen; keine lokale Sonderbehandlung darf die Unterschiede kaschieren"
      - "D-0 Huelle: Kandidat §18/§19 und der Korpus beschreiben ATCE/0x02, die Freigabe zu D1-B/D1-C verlangt ATCB/0x01. Bis zur Entscheidung bleibt der Code bei ATCB/0x01 und der Korpus ist nicht gegen die VM lauffaehig (Nachweis EXEC-D1BC-VM-PARSER-EVIDENCE-2026-11-12.md, Abschnitt 8)"

