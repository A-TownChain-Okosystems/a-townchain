# Entscheidungsregister Smart-Contract-Ausfuehrung
# SSOT fuer D1 bis D7. Die Tabellen in
#   docs/decisions/AD-EXEC-D1-D7.md
#   standards/atc/candidates/ATC-SMART-CONTRACT-EXECUTION-001-CANDIDATE.md
# werden aus dieser Datei erzeugt (tools/decision_register.py).
# Aenderungen nur hier; dann `python3 tools/decision_register.py --write`.

register: ATC-EXEC-DECISIONS
version: 1
owner: Michael Wroblewski
decided_on: 2026-11-12
source: "Owner-Bewertung P1 (Chat, 12.11.2026)"
ladder:
  - DECIDED       # Architekturentscheidung getroffen
  - SPECIFIED     # vollstaendig normativ spezifiziert (Kandidat bzw. Standard)
  - IMPLEMENTED   # Umsetzung im bestehenden System nachgewiesen
rules:
  - "Kein Zustand ersetzt den naechsten automatisch."
  - "Die Gates bleiben bis zum jeweiligen Nachweis offen."
pending_globally:
  - "Numerische Gaspreise (Messung je Instruktionsklasse und Vertragsbenchmark)"
  - "Endgueltiges Transaktionsgaslimit"
  - "Endgueltiges Blockgaslimit"
  - "Implementierungs- und CI-Gates"
  - "Konflikt Aufruftiefe: Owner-Entscheidung 64 vom 09.11.2026 in ATC-BC-002 (Kandidat, nicht ratifiziert) gegen SCE-Vorschlag 8 (R-901)"
  - "Artefaktidentitaet: Container-Magic ATCB gegen SCE-D1, zwei Hashumfaenge ohne getrennte Namen (R-903)"
  - "Fehlende CALL-Instruktion und Identitaetstyp auf dem u64-Stapel (R-902, R-907)"
  - "Zirkularitaet P1a/P2: Grenzwerttests brauchen den Aufrufmechanismus (R-905)"
  - "Autoritaet der beiden Instruktionssaetze (R-906)"

decisions:
  - id: D1
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.1 (nicht ratifiziert)"
    title: "Bytecode-Kopf: eigene VM-Huelle, ATC-BC-001 unveraendert"
    decision_status: DECIDED
    decision: FREIGEGEBEN
    specification_status: OPEN
    implementation_status: OPEN
    gate: SCE-G1
    conditions:
      - "eigenes Magic"
      - "eigene Versionskennung"
      - "festgelegte Byte-Reihenfolge"
      - "eindeutige Laengenangabe"
      - "kanonische Serialisierung"
      - "keine Aenderung am bestehenden Transaktionsformat"
      - "SCX-003 und SCE-ARTIFACT verwenden dieselbe Formatdefinition; ATCB ist nicht das Magic des VM-Containers"
      - "Magic der Huelle: Vorschlag ATCE, Bestaetigung offen"
    open_items: []

  - id: D2
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.3, §5.10 (nicht ratifiziert)"
    title: "Aufrufkonvention: ABI-Selektor, Calldata, Rueckgabepuffer"
    decision_status: DECIDED
    decision: BEDINGT_FREIGEGEBEN
    specification_status: OPEN
    implementation_status: OPEN
    gate: SCE-G3
    conditions:
      - "Selektor-Hashverfahren und Selektorbreite festgelegt"
      - "Wortgroesse und Calldata-Encoding festgelegt"
      - "maximale Rueckgabepuffergroesse festgelegt"
      - "deterministische Vertragsadressableitung festgelegt"
      - "atomare Rueckabwicklung fehlgeschlagener Transaktionen festgelegt"
      - "Vertrag-zu-Vertrag-Aufrufe bis BC-002 gesperrt"
    open_items:
      - "Vertrag-zu-Vertrag-Aufruf (haengt an ATC-BC-002 Ratifizierung)"
      - "Grenzwerte 8192/4096 Byte und Tiefe 8: eigene Begruendung liegt vor, Bestaetigung erst nach T-21 bis T-24"
      - "Adresseingabe bytegenau: Domain 15 Byte, Gesamtlaenge 75 Byte, Laengenpruefung Pflicht (T-41)"

  - id: D3
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.4 (nicht ratifiziert)"
    title: "Storage: Frame-lokal und persistente S1-Slots"
    decision_status: DECIDED
    decision: FREIGEGEBEN
    specification_status: OPEN
    implementation_status: OPEN
    gate: SCE-G4
    conditions:
      - "Lokale ausschliesslich im Execution Frame"
      - "persistente Daten ausschliesslich in S1-Slots"
      - "layout_hash je Vertragsversion pruefbar"
      - "Maps ausgeschlossen bis Schluesselcodierung, Hashing und Storage-Proofs normiert sind"
    open_items:
      - "Map-Schluesselcodierung und Storage-Proofs (eigene Normung)"

  - id: D4
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.6, §5.10 (nicht ratifiziert)"
    title: "Gas: eine Tabelle, Transaktionsbudget, Gebuehrenabbuchung"
    decision_status: DECIDED
    decision: BEDINGT_FREIGEGEBEN
    specification_status: OPEN
    implementation_status: OPEN
    gate: SCE-G6
    conditions:
      - "Trennung gas_limit, gas_used, gas_price, fee_charged, gas_refund"
      - "Gebuehrenabrechnung unabhaengig vom Rollback des Vertragszustands"
      - "fehlgeschlagener Vertrag verbraucht Rechenzeit nicht kostenlos"
      - "Gebuehren und Verbrauch im Transaktionsbeleg"
      - "keine Gebuehrenumgehung ueber Backend oder Loader"
      - "Fehlerklassen getrennt: Erschoepfung volles Budget, Revert nur verbrauchtes Gas, Ablehnung ohne Ausfuehrung ohne Gas (REQ-SCE-047, 054)"
      - "gas_refund in Gaseinheiten, Geldbetrag getrennt benannt (REQ-SCE-055)"
      - "Erstattungsregel normativ festlegen und mit T-28 belegen; Formeln bisher ausdruecklicher Vorschlag"
      - "Vierte Fehlerklasse: interner Infrastrukturfehler ohne Nutzerbelastung, deterministisch, eigener Statuscode (REQ-SCE-060)"
      - "Zwei getrennte Code-Raeume: Beleg-Status 0x00 bis 0x03, Knotenfehler ATC-NODE-INFRA-001 nie im Beleg (REQ-SCE-054)"
      - "Wiederaufnahme: derselbe Block nach behobenem Fehler deterministisch identisch (REQ-SCE-060 Punkt 4)"
    open_items:
      - "numerische Instruktionskosten (Messung je Instruktionsklasse)"
      - "Transaktionsgaslimit, Blockgaslimit, Dynamik nach Auslastung"

  - id: D5
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.7, §5.10 (nicht ratifiziert)"
    title: "Blockausfuehrung: deterministische Validator-Ausfuehrung"
    decision_status: DECIDED
    decision: FREIGEGEBEN
    specification_status: OPEN
    implementation_status: OPEN
    gate: SCE-G7
    conditions:
      - "deterministische Transaktionsreihenfolge"
      - "identische VM-Version bei allen Validatoren"
      - "identische Gasberechnung"
      - "atomare Zustandsaenderungen"
      - "reproduzierbare Receipts"
      - "verbindliche State-Root-Berechnung"
      - "unabhaengiges Nachrechnen durch Validatoren"
    open_items: []

  - id: D6
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.5, §5.10 (nicht ratifiziert)"
    title: "Identitaet: 32-Byte-Identitaetswort"
    decision_status: DECIDED
    decision: BEDINGT_FREIGEGEBEN
    specification_status: OPEN
    implementation_status: OPEN
    gate: SCE-G5
    conditions:
      - "Nachweis: DID und Kontoidentitaet nutzen dieselbe kanonische Ableitung"
      - "Nachweis: keine fremde Identitaet durch Transaktionsfelder einschleusbar"
      - "Nachweis: Signaturpruefung authentifiziert die Identitaet"
      - "Nachweis: interne Vertragsaufrufe bilden den unmittelbaren Aufrufer korrekt ab"
      - "keine Vertrauensluecke zwischen Wallet, Blockchain und VM"
      - "origin, caller und Vertragsadresse getrennt definiert (REQ-SCE-051 bis 053)"
      - "caller bei Vertrag-zu-Vertrag ist die Vertragsadresse, nicht die Wallet (REQ-SCE-052)"
      - "IdentityValue: ein kanonisches 32-Byte-Layout (Kennzeichen 0..3, reservierte Nullbytes 4..11, Adresse 12..31), fail-closed, eine Implementierung (REQ-SCE-057 bis 059)"
      - "Testvektoren als gemeinsame Datei standards/atc/conformance/identity-value-vectors.json"
    open_items:
      - "interne Aufrufe: erst nach BC-002 pruefbar"

  - id: D7
    ratification: "nicht ratifiziert (Kandidat)"
    specified_in: "Kandidat §5.2 (nicht ratifiziert)"
    title: "Frontend: ATCLang kanonisch, .ops nur Testwerkzeug"
    decision_status: DECIDED
    decision: FREIGEGEBEN
    specification_status: OPEN
    implementation_status: OPEN
    gate: SCE-G2
    conditions:
      - "ATCLang ist das einzige kanonische Frontend"
      - ".ops nur fuer interne Tests und Testfixtures"
      - ".ops niemals als alternativer produktiver Bytecode-Eingang"
    open_items: []

zusatzanforderungen:
  - id: SCE-Z1
    title: "VM-Versionierung"
    rule: "Ein Validator darf nicht unbemerkt eine andere Ausfuehrungssemantik verwenden."
    mapped_to: [REQ-SCE-042, SCX-004, SCX-009]
  - id: SCE-Z2
    title: "State-Rollback"
    rule: "Jede fehlgeschlagene Ausfuehrung rollt ihren Vertragszustand vollstaendig zurueck."
    mapped_to: [REQ-SCE-043, SCX-008]
  - id: SCE-Z3
    title: "Replay-Sicherheit"
    rule: "Dieselbe Transaktion darf durch erneute Verarbeitung keine doppelten Zustandsaenderungen verursachen."
    mapped_to: [REQ-SCE-044, SCX-006, SCX-009]

